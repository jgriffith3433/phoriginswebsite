<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PH Origins</title>
    <meta name="description" content="PH Origins — Discover where your story begins.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050608;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            position: relative;
        }

        /* Background */
        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(78, 116, 145, 0.18),
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #080b10 0%,
                    #050608 55%,
                    #020304 100%
                );
        }

        /* Atmospheric glow */
        .glow {
            position: absolute;
            width: 55vw;
            height: 55vw;
            max-width: 800px;
            max-height: 800px;
            left: 50%;
            top: 42%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(90, 145, 180, 0.08);
            filter: blur(100px);
            animation: breathe 5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% {
                opacity: .45;
                transform: translate(-50%, -50%) scale(.95);
            }

            50% {
                opacity: .8;
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        /* Stars */
        .stars,
        .stars::before,
        .stars::after {
            position: absolute;
            inset: 0;
            content: "";
            background-image:
                radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 1px);
            background-size: 180px 180px, 310px 310px;
            background-position: 20px 40px, 100px 160px;
            opacity: .22;
        }

        .stars::before {
            transform: scale(1.5);
            opacity: .12;
        }

        /* Main */
        .container {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: min(900px, 100%);
            animation: appear 1.5s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: 7px;
            text-transform: uppercase;
            color: rgba(255,255,255,.5);
            margin-bottom: 24px;
        }

        .logo {
            font-size: clamp(58px, 12vw, 150px);
            line-height: .85;
            font-weight: 900;
            letter-spacing: -7px;
            text-transform: uppercase;

            background: linear-gradient(
                180deg,
                #ffffff 0%,
                #cbd3d8 45%,
                #6e7b83 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow:
                0 0 40px rgba(150,190,210,.12);

            margin-bottom: 26px;
        }

        .subtitle {
            font-size: clamp(16px, 2vw, 23px);
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #aeb9bf;
            margin-bottom: 50px;
        }

        .description {
            max-width: 570px;
            margin: 0 auto 42px;
            font-size: 15px;
            line-height: 1.8;
            color: rgba(255,255,255,.52);
        }

        /* Button */
        .play-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 210px;
            height: 58px;

            border: 1px solid rgba(255,255,255,.4);
            background: rgba(255,255,255,.05);
            color: white;

            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 12px;
            font-weight: bold;

            transition:
                background .25s ease,
                border-color .25s ease,
                transform .25s ease,
                box-shadow .25s ease;
        }

        .play-button:hover {
            background: rgba(255,255,255,.13);
            border-color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(100,160,190,.12);
        }

        .play-button span {
            margin-left: 12px;
            font-size: 15px;
        }

        /* Bottom */
        .footer {
            position: fixed;
            z-index: 3;
            left: 0;
            right: 0;
            bottom: 24px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;

            color: rgba(255,255,255,.25);
        }

        /* Corner UI */
        .corner {
            position: fixed;
            z-index: 3;
            width: 45px;
            height: 45px;
            opacity: .3;
        }

        .corner::before,
        .corner::after {
            content: "";
            position: absolute;
            background: white;
        }

        .corner::before {
            width: 45px;
            height: 1px;
        }

        .corner::after {
            width: 1px;
            height: 45px;
        }

        .top-left {
            top: 25px;
            left: 25px;
        }

        .top-right {
            top: 25px;
            right: 25px;
            transform: rotate(90deg);
        }

        .bottom-left {
            bottom: 25px;
            left: 25px;
            transform: rotate(-90deg);
        }

        .bottom-right {
            bottom: 25px;
            right: 25px;
            transform: rotate(180deg);
        }

        /* Mobile */
        @media (max-width: 600px) {
            .logo {
                letter-spacing: -4px;
            }

            .subtitle {
                letter-spacing: 3px;
            }

            .description {
                font-size: 14px;
            }

            .corner {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div class="glow"></div>
    <div class="stars"></div>

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <main class="container">
        <div class="content">

            <div class="eyebrow">
                A New Story Begins
            </div>

            <h1 class="logo">
                PH
            </h1>

            <div class="subtitle">
                Origins
            </div>

            <p class="description">
                Before the legends. Before the kingdoms.
                Before anyone knew your name.
                There was an origin.
            </p>

            <a class="play-button" href="game.html">
                Enter the Game
                <span>›</span>
            </a>

        </div>
    </main>

    <div class="footer">
        PH ORIGINS &nbsp;•&nbsp; © 2026
    </div>

</body>
</html>
