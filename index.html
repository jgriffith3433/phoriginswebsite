<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#020a04" />
    <meta
      name="description"
      content="PH Origins is a third-person story set on the 58th floor of Hawkes Tower, and in the lab the board keeps dark. This front page is the Hawkes gateway terminal: follow the guide, get root, build the backend."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>PH Origins</title>
    <link rel="stylesheet" href="./site/terminal/terminal.css" />
    <!-- Hawkes Analytics (anonymous, no cookies): the build from the last game build, then the SDK from Hawkes Gen. -->
    <script src="./play/hawkes-build.js" defer></script>
    <script src="https://hawkesgen.ai/sdk/analytics@1.js" data-product="phorigins" defer></script>
  </head>
  <body data-page="home">
    <a class="skip" href="#termInput">Skip to the terminal</a>
    <div id="app">
      <h1 class="sr-only">PH Origins: gateway console</h1>
      <main id="screen" aria-label="Terminal">
        <div id="termLog" role="log" aria-live="polite" aria-relevant="additions" aria-label="Terminal output"></div>
        <form id="termForm" class="promptrow" autocomplete="off">
          <label id="termPrompt" class="prompt" for="termInput">guest@ph-origins:~$</label>
          <div class="inputwrap">
            <span id="termMirror" aria-hidden="true"></span>
            <input id="termInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" inputmode="text" aria-label="Terminal command" />
          </div>
        </form>
        <noscript>
          <p class="line">The Hawkes gateway terminal lives here and needs JavaScript. Without it: <a href="./play/game.html">play the game</a>, read <a href="./about.html">about</a>, meet <a href="./characters.html">the cast</a>, or read <a href="./lore.html">the lore</a>.</p>
        </noscript>
      </main>
      <div class="tapbar" role="toolbar" aria-label="Quick keys">
        <button type="button" data-act="help">help</button>
        <button type="button" data-act="ls">ls</button>
        <button type="button" data-act="hint">hint</button>
        <button type="button" data-act="tab" aria-label="Tab (complete)">Tab</button>
        <button type="button" data-act="up" aria-label="Previous command">&uarr;</button>
        <button type="button" data-act="down" aria-label="Next command">&darr;</button>
        <button type="button" data-act="ctrlc" aria-label="Control C (cancel)">^C</button>
      </div>
      <footer class="foot">
        <nav aria-label="Site">
          <a href="./about.html">About</a>
          <a href="./characters.html">Characters</a>
          <a href="./lore.html">Lore</a>
          <a href="./whatsnew.html">What&rsquo;s new</a>
          <a data-play href="./play/game.html">Play</a>
        </nav>
        <a class="footer-version" href="./whatsnew.html" data-hawkes-version data-prefix="Version " hidden></a>
        <p class="hawkes-credit">
          <a href="https://hawkesbiomedical.com" target="_blank" rel="noopener" data-hawkes-credit="parent">A <strong>Hawkes Biomedical</strong> company</a>
          &middot;
          <a href="https://hawkesgen.ai" target="_blank" rel="noopener" data-hawkes-credit="gen">Powered by <strong>HAWKES GEN</strong></a>
        </p>
        <p class="site-privacy">This site collects anonymous gameplay statistics to improve the game: no cookies, no personal data, no IP address stored.</p>
      </footer>
    </div>
    <script type="module" src="./site/terminal/main.js"></script>
    <script src="./site/hawkes-release.js" data-releases="./releases.json" defer></script>
    <script>
      // Hawkes Studio's playtest bot opens the site's front page and waits for window.hawkesPlaytest. The game (and
      // its real contract, src/playtest/phPlaytest.ts) lives at play/game.html, so this hand-off sends a started
      // scenario there; the game picks it up from ?playtest= and installs the real window.hawkesPlaytest. Visitors
      // never call it. Site-only playtests don't call start() and keep reviewing this page.
      (function () {
        var going = null;
        var scenarios = [
          { id: 'smoke', title: 'Boot, title, start level 1, answer the call, walk to the board; hitchFailOver100; chapter-card black-frame check on levels 1-8 desktop and 844x390; short L1 explore-cam (cameraInside/blocked/snaps + worst screenshots)', seconds: 840, tags: ['smoke', 'perf', 'ui', 'camera'] },
          { id: 'level-1', title: 'Level 1: The Apex Peak to its exit', seconds: 330, tags: ['level'] },
          { id: 'level-2', title: 'Level 2: B3 to its exit (starts at level 2)', seconds: 170, tags: ['level'] },
          { id: 'level-3', title: 'Level 3: The Return to its exit (starts at level 3)', seconds: 200, tags: ['level'] },
          { id: 'level-4', title: 'Level 4: The Desk to its exit (starts at level 4)', seconds: 100, tags: ['level'] },
          { id: 'level-5', title: 'Level 5: Going Home to its exit (starts at level 5)', seconds: 200, tags: ['level'] },
          { id: 'level-6', title: 'Level 6: The Station to its exit (starts at level 6)', seconds: 110, tags: ['level'] },
          { id: 'explore-cam-l1', title: 'Explore camera, level 1 (The Apex Peak): wall-hugs hallways, turns in doorways, backs into corners; camera inside/blocked/snaps vs docs/camera.md baseline', seconds: 300, tags: ['smoke', 'camera', 'level'] },
          { id: 'explore-cam-l2', title: 'Explore camera, level 2 (B3): wall-hugs hallways, turns in doorways, backs into corners; camera inside/blocked/snaps vs docs/camera.md baseline', seconds: 300, tags: ['smoke', 'camera', 'level'] },
          { id: 'explore-cam-l3', title: 'Explore camera, level 3 (The Return): wall-hugs hallways, turns in doorways, backs into corners; camera inside/blocked/snaps vs docs/camera.md baseline', seconds: 300, tags: ['smoke', 'camera', 'level'] },
          { id: 'explore-cam-l4', title: 'Explore camera, level 4 (The Desk): wall-hugs hallways, turns in doorways, backs into corners; camera inside/blocked/snaps vs docs/camera.md baseline', seconds: 300, tags: ['smoke', 'camera', 'level'] },
          { id: 'explore-cam-l5', title: 'Explore camera, level 5 (Going Home): wall-hugs hallways, turns in doorways, backs into corners; camera inside/blocked/snaps vs docs/camera.md baseline', seconds: 300, tags: ['smoke', 'camera', 'level'] },
          { id: 'explore-cam-l6', title: 'Explore camera, level 6 (The Station): wall-hugs hallways, turns in doorways, backs into corners; camera inside/blocked/snaps vs docs/camera.md baseline', seconds: 300, tags: ['smoke', 'camera', 'level'] },
          { id: 'explore-cam-l7', title: 'Explore camera, level 7 (The Train): wall-hugs hallways, turns in doorways, backs into corners; camera inside/blocked/snaps vs docs/camera.md baseline', seconds: 300, tags: ['smoke', 'camera', 'level'] },
          { id: 'explore-cam-l8', title: 'Explore camera, level 8 (The Morning): wall-hugs hallways, turns in doorways, backs into corners; camera inside/blocked/snaps vs docs/camera.md baseline', seconds: 300, tags: ['smoke', 'camera', 'level'] },
          { id: 'interior-cam', title: 'Interior camera volumes: Level 1 halls (hallway profile, occlusion fade) and Level 8 apartment on desktop and 844x390', seconds: 420, tags: ['smoke', 'camera', 'level'] },
          { id: 'smoke-l1', title: 'Smoke, level 1 (The Apex Peak): starts it directly, plays the objectives in order, long scenes skipped early, ends at its end card; stuck after 30 s with no objective progress', seconds: 240, tags: ['smoke', 'level'] },
          { id: 'smoke-l2', title: 'Smoke, level 2 (B3): starts it directly, plays the objectives in order, long scenes skipped early, ends at its end card; stuck after 30 s with no objective progress', seconds: 240, tags: ['smoke', 'level'] },
          { id: 'smoke-l3', title: 'Smoke, level 3 (The Return): starts it directly, plays the objectives in order, long scenes skipped early, ends at its end card; stuck after 30 s with no objective progress', seconds: 240, tags: ['smoke', 'level'] },
          { id: 'smoke-l4', title: 'Smoke, level 4 (The Desk): starts it directly, plays the objectives in order, long scenes skipped early, ends at its end card; stuck after 30 s with no objective progress', seconds: 240, tags: ['smoke', 'level'] },
          { id: 'smoke-l5', title: 'Smoke, level 5 (Going Home): starts it directly, plays the objectives in order, long scenes skipped early, ends at its end card; stuck after 30 s with no objective progress', seconds: 240, tags: ['smoke', 'level'] },
          { id: 'smoke-l6', title: 'Smoke, level 6 (The Station): starts it directly, plays the objectives in order, long scenes skipped early, ends at its end card; stuck after 30 s with no objective progress', seconds: 240, tags: ['smoke', 'level'] },
          { id: 'smoke-l7', title: 'Smoke, level 7 (The Train): starts it directly, plays the objectives in order, long scenes skipped early, ends at its end card; stuck after 30 s with no objective progress', seconds: 240, tags: ['smoke', 'level'] },
          { id: 'smoke-l8', title: 'Smoke, level 8 (The Morning): starts it directly, plays the objectives in order, long scenes skipped early, ends at its end card; stuck after 30 s with no objective progress', seconds: 240, tags: ['smoke', 'level'] },
          { id: 'stuck-recovery', title: 'Idle 60 s in level 1: "Lost? Return to objective" shows and puts Pierce beside the objective; Pause always offers it; tappable at 390x844 and 844x390', seconds: 420, tags: ['menus', 'ui'] },
          { id: 'full', title: "Levels 1–8 in order, cutscenes included (long rides skipped after 16 s); Level 7's card Continues into The Morning", seconds: 1400, tags: ['full'] },
          { id: 'sound-settings', title: 'Tap to play unlocks sound, Settings from the title and from Pause, a setting that survives a reload', seconds: 120, tags: ['menus', 'sound'] },
          { id: 'cutscene-ui', title: 'Cinematic HUD/letterbox/Skip clear of health; Settings invert Y, sensitivity and subtitles persist; phone layouts', seconds: 360, tags: ['menus', 'ui'] },
          { id: 'feel-audio', title: 'Each level has its own bed, a strike gives sound and a screen pulse, volume sliders persist', seconds: 200, tags: ['sound'] },
          { id: 'ui-style', title: 'Menu, HUD, pause, settings and end cards share fonts and colours, nothing is clipped, and no touch control overlaps another or is under 44 px at 390x844, 844x390 and 667x375', seconds: 170, tags: ['menus'] },
          { id: 'screen-mode', title: 'Turn your phone sideways in portrait (dismissable), Start asks for fullscreen and the landscape lock, Pause has a Fullscreen switch, desktop is unchanged', seconds: 90, tags: ['menus', 'ui'] },
          { id: 'objective-marker', title: 'The objective waypoint shows name and distance, clamps to the screen edge with an arrow, hides in scenes and menus, and stays clear of the touch controls', seconds: 240, tags: ['hud'] },
          { id: 'load-error', title: "A level that fails to load shows Couldn't start the game and Retry; Retry reloads to START", seconds: 90, tags: ['menus'] },
          { id: 'phone-b3', title: 'Phone title card and buttons, About beat 01, then B3 with the creature downed before decon', seconds: 260, tags: ['menus'] },
          { id: 'chapters', title: 'Chapter title cards: levels 1 to 8 each open on their own card; one press skips it; no placeholder text', seconds: 420, tags: ['level', 'ui'] },
          { id: 'transition', title: 'Chapter card to world: card held until the world has rendered, crossfade, HUD only after; no black frames (levels 1-8, desktop and 844x390)', seconds: 600, tags: ['level', 'ui'] },
          { id: 'hitch-board', title: 'Level 1 spawn to board table with named hitch causes; phone sample of levels 1, 4 and 8', seconds: 240, tags: ['smoke', 'perf', 'level'] },
          { id: 'board-faces', title: 'Board meeting faces: lip sync, blinks, head look-at and three dialogue gestures', seconds: 180, tags: ['level', 'quality', 'characters'] },
          { id: 'context-loss', title: 'Level 1: lose the WebGL context, Recovering shows, the level resumes; memory tier and level change counts', seconds: 300, tags: ['graphics', 'level'] },
          { id: 'b3-retry', title: 'B3: die and press Start five times; meshes, materials, textures, skeletons, clips and lights stay flat', seconds: 420, tags: ['level', 'perf'] },
          { id: 'analytics', title: 'Hawkes Analytics: level 1 played to its card, the events going out (debug log), the feedback card after the level', seconds: 360, tags: ['level', 'analytics'] },
          { id: 'apex-slice', title: 'Apex Peak vertical slice: hall life, cleaner, sofa, papers, valuation screen; quality.maxQuietSeconds and quality.textOnlyBeats', seconds: 240, tags: ['level', 'quality', 'story'] },
          { id: 'train', title: 'Level 7: the subway car. Seats, poles, ads, tunnel lights, sway; seats and poles block; listed on Load Level; fps vs The Station', seconds: 200, tags: ['level', 'perf'] },
          { id: 'level-8', title: "Level 8, The Morning: the 7 scenes in order (ride, walk up, threshold), bed, the wake-up, the news naming Hawkes Tower and Pierce, Voss's call in full, the door, End Level", seconds: 240, tags: ['level', 'story'] },
          { id: 'level-8-ending', title: "Level 8's ending on a phone: walk to the door by touch, coat, white dawn, black, PH ORIGINS, credits over 6+ places, the Act II call and end card", seconds: 420, tags: ['level', 'story', 'phone'] },
          { id: 'level-8-release', title: 'The Train Continue enters The Morning; the whole of level 8 follows', seconds: 520, tags: ['level'] },
          { id: 'level-7-release', title: 'The Station Continue enters The Train; End Level only after the story, then the station song and level 7 credits; Continue and Exit; Load Level lists it', seconds: 480, tags: ['level'] },
          { id: 'level-7', title: 'Level 7, The Train: the opening scene voiced and in order, Skip, the old body one car ahead, the stop, Shadow mode, the door, then the end song and credits', seconds: 240, tags: ['level'] },
          { id: 'lore-link', title: 'Finish level 4 and unlock its lore entry, open its Read more page, check every lore page has Play this level', seconds: 200, tags: ['level', 'site'] },
          { id: 'site-links', title: 'Powered by HAWKES GEN on every site page, Hawkes Biomedical on Home, About lists levels 1-7 playable, the game screen unchanged', seconds: 60, tags: ['menus', 'site'] },
          { id: 'terminal', title: 'Terminal landing page: boot to prompt, /help, solve the five-step chain from the clues, root, /build as a three-act show (log flood, song, text flipbook of two silhouettes; Esc skips) to BUILD SUCCESSFUL, game opens the game; no console errors', seconds: 220, tags: ['site', 'first-minute', 'ui'] },
          { id: 'terminal-phone', title: 'Terminal on a 390x844 phone: prompt above the keyboard, tap buttons (help, Tab, history, Ctrl+C), 44 px targets, 14 px text, no sideways scroll, reduced-motion boot, the /build flipbook with both silhouettes visible', seconds: 90, tags: ['site', 'phone', 'ui'] },
          { id: 'frame-trace', title: 'Frame-time trace on all eight levels (desktop and phone): hitch counts, worst causes, no post-grace frame over 100 ms', seconds: 420, tags: ['smoke', 'perf'] },
          { id: 'first-five', title: 'First five: Tap to play goes straight into a playable B3 hall (flashlight on, creature on screen), then "Six hours earlier." and the title; warm under Tap to play; hitchFailOver100', seconds: 120, tags: ['ftue', 'first-minute', 'perf'] },
          { id: 'quiet-light', title: 'Quiet chapters light: Morning sun shafts + TV spill, Desk lamp long shadows + mirror text, Return buzzing tube (options.phone: 390x844 Low shafts ≥30 fps)', seconds: 420, tags: ['level', 'feel', 'phone', 'quality'] }
        ];
        window.hawkesPlaytest = {
          version: 1,
          product: 'phorigins',
          scenarios: function () { return scenarios.map(function (s) { return Object.assign({}, s); }); },
          start: function (id, options) {
            if (!scenarios.some(function (s) { return s.id === id; })) {
              return Promise.reject(new Error('no playtest scenario "' + id + '" (have: ' + scenarios.map(function (s) { return s.id; }).join(', ') + ')'));
            }
            options = options || {};
            var q = new URLSearchParams({ playtest: String(id), seed: String(options.seed || 1), speed: String(options.speed || 1) });
            // a start point and a feel replay's spot (a place the feel sensor flagged) go along to the game
            if (options.at != null && options.at !== '') q.set('at', String(options.at));
            if (options.spot) q.set('spot', String(options.spot));
            going = { id: String(id) };
            location.assign('./play/game.html?' + q.toString());
            return Promise.resolve();
          },
          stop: function () {},
          state: function () { return going ? { ready: true, status: 'running', progress: 0, scene: 'Opening the game' } : { ready: true, status: 'idle' }; },
          report: function () { return null; },
        };
      })();
    </script>
  </body>
</html>
