<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Through the Galaxies</title>
<meta name="description" content="Fly through real galaxies at their real sizes and real separations, fast enough to cross each one in two minutes.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#eaf2ff;--dim:rgba(220,232,255,.62);--line:rgba(160,200,255,.28);--glow:rgba(120,180,255,.55)}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;text-align:center;padding:max(14px,env(safe-area-inset-top)) 16px 34px;background:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.28) 65%,transparent);text-shadow:0 0 18px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.9)}
#bar{position:fixed;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,transparent,#9cc8ff 40%,#fff);box-shadow:0 0 12px var(--glow)}
.now{font:600 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.42em;color:var(--dim);text-transform:uppercase}
.name{font-weight:700;font-size:clamp(30px,6.2vw,76px);line-height:1.02;letter-spacing:.06em;text-transform:uppercase;margin:.18em 0 .12em;color:#fff;text-shadow:0 0 28px rgba(110,165,255,.75),0 0 6px rgba(160,200,255,.6),0 2px 14px rgba(0,0,0,.9);animation:rise .9s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;letter-spacing:.3em;filter:blur(6px)}to{opacity:1;letter-spacing:.06em;filter:blur(0)}}
.sub{font:400 clamp(11px,1.35vw,14px)/1.5 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);letter-spacing:.06em;max-width:960px;margin:0 auto}
.sub b{color:var(--ink);font-weight:600}
#side,#left{background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent);padding:10px 12px}
#side{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));text-align:right;font:400 11px/1.6 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);letter-spacing:.06em;pointer-events:none;text-shadow:0 0 10px #000}
#side .v{font:600 clamp(15px,2vw,22px)/1.2 "JetBrains Mono",ui-monospace,monospace;color:var(--ink);letter-spacing:.02em}
#left{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));font:400 11px/1.6 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);letter-spacing:.06em;pointer-events:none;text-shadow:0 0 10px #000;max-width:46vw}
#left .v{font:600 clamp(13px,1.6vw,17px)/1.2 "JetBrains Mono",ui-monospace,monospace;color:var(--ink)}
#nogl{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font:400 15px/1.6 "JetBrains Mono",monospace;color:var(--dim)}
@media (max-width:640px){#left{max-width:44vw}.sub{font-size:11px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="hud" aria-live="polite">
  <div class="now" id="now">Now crossing</div>
  <div class="name" id="name">The Milky Way</div>
  <div class="sub" id="sub"></div>
</div>
<div id="left"><div>Crossed so far</div><div class="v" id="dist">0 ly</div><div id="left2"></div></div>
<div id="side"><div>Speed</div><div class="v" id="speed">0 c</div><div id="side2"></div></div>
<div id="nogl">This flight needs WebGL 2. Try a current Chrome, Edge, Firefox or Safari.</div>
<script>
(function () {
'use strict';
// ---------------------------------------------------------------------------------------------------------------
// Through the Galaxies. Real galaxies at their catalog sizes, in the order below, each crossed in two minutes.
// Units in the scene: 1 = 1,000 light-years (kly). Positions are drawn relative to the camera (double precision on
// the CPU), so float precision on the GPU is never stretched. Between galaxies the void is crossed quickly (the
// distance shown is the true 3D separation from the catalog positions; only the time is compressed).
//
// The physics kept honest:
//  * stars are point sources: received flux = L / d^2 (inverse square); nebulae and dust are extended: surface
//    brightness does not change with distance, only their angular size (= physical size / distance)
//  * disks: exponential surface density, Sigma(r) ~ exp(-r/h)  =>  r ~ Gamma(2, h) = -h ln(U1 U2)
//  * vertical: sech^2 layers (isothermal sheet), z = h_z * atanh(2U-1)
//  * spiral arms: logarithmic spirals, theta(r) = ln(r/r0) / tan(pitch)
//  * bulges and ellipticals: Hernquist profiles, M(<r) = M r^2/(r+a)^2  =>  r = a sqrt(u) / (1 - sqrt(u))
//  * star colours: blackbody temperature -> RGB
//  * speed = (distance crossed) / (time), shown in multiples of c (1 c = 1 light-year per year)
// ---------------------------------------------------------------------------------------------------------------

var YEAR_S = 31557600; // seconds in a Julian year: v/c = (light-years per second) * YEAR_S
var CROSS_S = 120;     // seconds to cross each galaxy
var GAP_S = 6.5;       // seconds through each intergalactic void

// RA in hours, Dec in degrees, distance in light-years (to the galaxy's centre), diameter in light-years.
var CAT = [
  { key: 'mw', name: 'The Milky Way', id: 'Our galaxy', type: 'SBbc barred spiral', ra: 17.7611, dec: -29.0078, dist: 26000, diam: 100000, kind: 'barred', arms: 4, pitch: 12, h: 0.17, bulge: 0.12, bar: 0.27, note: 'You start at the Sun, 26,000 ly from the centre, in the Orion Arm' },
  { key: 'lmc', name: 'Large Magellanic Cloud', id: 'LMC', type: 'SB(s)m Magellanic spiral', ra: 5.3931, dec: -69.7561, dist: 163000, diam: 32200, kind: 'irregular', note: 'The Tarantula Nebula is the brightest star-forming region in the Local Group' },
  { key: 'm33', name: 'Triangulum', id: 'M33 · NGC 598', type: 'SA(s)cd flocculent spiral', ra: 1.5639, dec: 30.6603, dist: 2730000, diam: 61100, kind: 'spiral', arms: 6, pitch: 24, h: 0.2, bulge: 0.03, flocculent: 1, note: 'NGC 604, one of the largest HII regions known, lies in an outer arm' },
  { key: 'm31', name: 'Andromeda', id: 'M31 · NGC 224', type: 'SA(s)b spiral', ra: 0.7123, dec: 41.2692, dist: 2537000, diam: 152000, kind: 'spiral', arms: 2, pitch: 8, h: 0.24, bulge: 0.16, ring: 0.44, sats: 1, note: 'With M32 and M110, two of its satellite galaxies' },
  { key: 'm101', name: 'Pinwheel', id: 'M101 · NGC 5457', type: 'SAB(rs)cd spiral', ra: 14.0535, dec: 54.3492, dist: 20900000, diam: 170000, kind: 'spiral', arms: 4, pitch: 26, h: 0.2, bulge: 0.04, lopsided: 1, note: 'Lopsided arms studded with giant HII regions' },
  { key: 'm51', name: 'Whirlpool', id: 'M51a · NGC 5194', type: 'SA(s)bc pec grand-design spiral', ra: 13.4980, dec: 47.1953, dist: 31000000, diam: 76000, kind: 'spiral', arms: 2, pitch: 18, h: 0.2, bulge: 0.07, companion: 1, note: 'Its companion NGC 5195 is pulling on the end of an arm' },
  { key: 'm104', name: 'Sombrero', id: 'M104 · NGC 4594', type: 'SA(s)a spiral', ra: 12.6665, dec: -11.6231, dist: 31100000, diam: 49000, kind: 'sombrero', note: 'A huge bulge, about 2,000 globular clusters and a dark ring of dust' },
  { key: 'm87', name: 'Messier 87', id: 'Virgo A · NGC 4486', type: 'E0p cD supergiant elliptical', ra: 12.5137, dec: 12.3911, dist: 53500000, diam: 132000, kind: 'elliptical', axis: [1, 0.95, 0.9], globs: 1, jet: 1, note: 'A 4,900 ly jet from its 6.5-billion-solar-mass black hole; about 12,000 globular clusters' },
  { key: 'n1300', name: 'NGC 1300', id: 'NGC 1300', type: '(R′)SB(s)bc barred spiral', ra: 3.3281, dec: -19.4114, dist: 61000000, diam: 110000, kind: 'barred', arms: 2, pitch: 14, h: 0.22, bulge: 0.06, bar: 0.5, note: 'A textbook bar, with a grand-design spiral at each end' },
  { key: 'cart', name: 'Cartwheel', id: 'ESO 350-40', type: 'S pec ring galaxy', ra: 0.6281, dec: -33.7164, dist: 500000000, diam: 144000, kind: 'ringg', note: 'A smaller galaxy punched through it; the ring is a wave of new stars still spreading out' },
  { key: 'ic1101', name: 'IC 1101', id: 'Abell 2029 BCG', type: 'cD supergiant lenticular', ra: 15.1823, dec: 5.7447, dist: 1045000000, diam: 4000000, kind: 'elliptical', axis: [1, 0.7, 0.55], globs: 1, note: 'One of the largest galaxies known: a diffuse halo about 4 million ly across' }
];

// Catalog position of each galaxy (light-years, Earth-centred, equatorial x/y/z)
CAT.forEach(function (g) {
  var a = g.ra / 24 * Math.PI * 2, d = g.dec * Math.PI / 180;
  g.pos = [g.dist * Math.cos(d) * Math.cos(a), g.dist * Math.cos(d) * Math.sin(a), g.dist * Math.sin(d)];
  g.R = g.diam / 2000; // radius in kly
});
function sep(a, b) { var x = a.pos[0] - b.pos[0], y = a.pos[1] - b.pos[1], z = a.pos[2] - b.pos[2]; return Math.sqrt(x * x + y * y + z * z); }

// ---------------------------------------------------------------- formatting
var SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
function sci(v) {
  if (!isFinite(v) || v <= 0) return '0';
  var e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e);
  if (m >= 9.995) { m /= 10; e += 1; }
  if (e < 4) return Math.round(v).toLocaleString('en-US');
  return m.toFixed(2) + ' × 10' + String(e).split('').map(function (c) { return SUP[c]; }).join('');
}
function ly(v) {
  if (v < 1e6) return Math.round(v).toLocaleString('en-US') + ' ly';
  if (v < 1e9) return (v / 1e6).toFixed(v < 1e7 ? 2 : 1) + ' million ly';
  return (v / 1e9).toFixed(2) + ' billion ly';
}
function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// ---------------------------------------------------------------- random
function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gauss(r) { var u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307 * v); }
function sech2(r) { var u = r() * 1.998 - 0.999; return 0.5 * Math.log((1 + u) / (1 - u)); } // atanh(2U-1): sech^2 layer
function hern(r, a) { var s = Math.sqrt(r() * 0.985); return a * s / (1 - s); }               // Hernquist radius
function sphere(r) { var z = r() * 2 - 1, t = r() * 6.283185307, q = Math.sqrt(1 - z * z); return [q * Math.cos(t), q * Math.sin(t), z]; }

// Blackbody colour (Tanner Helland's fit), normalised so the brightest channel is 1
function kelvin(T) {
  var t = T / 100, r, g, b;
  if (t <= 66) { r = 255; g = 99.4708025861 * Math.log(t) - 161.1195681661; } else { r = 329.698727446 * Math.pow(t - 60, -0.1332047592); g = 288.1221695283 * Math.pow(t - 60, -0.0755148492); }
  if (t >= 66) b = 255; else if (t <= 19) b = 0; else b = 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  r = Math.min(255, Math.max(0, r)); g = Math.min(255, Math.max(0, g)); b = Math.min(255, Math.max(0, b));
  var m = Math.max(r, g, b); return [r / m, g / m, b / m];
}
var POP = { // temperature ranges (K) and luminosities for the stellar populations
  old: function (r) { return 3300 + Math.pow(r(), 1.6) * 2600; },
  disk: function (r) { return 3800 + Math.pow(r(), 1.3) * 4200; },
  young: function (r) { return 7500 + Math.pow(r(), 0.7) * 22000; }
};

// ---------------------------------------------------------------- galaxy builder
// Each particle: x, y, z (kly, galaxy frame: disk in x-y), r, g, b, s
//   s > 0: point source of luminosity s;  s < 0: extended object of radius -s kly (r,g,b = surface brightness;
//   negative = dust absorbing light)
var STRIDE = 7;
function Builder(n) { this.a = new Float32Array(n * STRIDE); this.n = 0; this.cap = n; }
Builder.prototype.put = function (x, y, z, c, k, s) {
  if (this.n >= this.cap) return; var o = this.n++ * STRIDE, a = this.a;
  a[o] = x; a[o + 1] = y; a[o + 2] = z; a[o + 3] = c[0] * k; a[o + 4] = c[1] * k; a[o + 5] = c[2] * k; a[o + 6] = s;
};
var HII = [1.0, 0.42, 0.62], OIII = [0.4, 0.9, 0.9], DUST = [-0.55, -0.5, -0.42];

function build(g, N, seed) {
  var r = rng(seed), B = new Builder(N), R = g.R, L = Math.pow(R / 50, 2) * 50000 / N * (g.key === 'ic1101' ? 0.3 : 1); // luminosity per particle scales with area (IC 1101: its diffuse halo is faint)
  function star(x, y, z, pop, lum) { var T = POP[pop](r); B.put(x, y, z, kelvin(T), 1, lum * L * (0.4 + r() * 1.2)); }
  function nebula(x, y, z, rad, col, k) { B.put(x, y, z, col, k, -rad); }
  function hernBlob(n, a, ax, pop, lum, cx, cy, cz) {
    for (var i = 0; i < n; i++) { var rr = hern(r, a), d = sphere(r); if (rr > R * 1.4) { i--; continue; } star(cx + d[0] * rr * ax[0], cy + d[1] * rr * ax[1], cz + d[2] * rr * ax[2], pop, lum); }
  }
  function disk(n, h, hz, pop, lum, rmax) {
    for (var i = 0; i < n; i++) { var rr = -h * Math.log(r() * r() + 1e-9); if (rr > rmax) { i--; continue; } var t = r() * 6.2832; star(rr * Math.cos(t), rr * Math.sin(t), sech2(r) * hz, pop, lum); }
  }
  // logarithmic-spiral arms: young stars, HII regions on the arms, dust on their inner (trailing) edge
  function arms(n, m, pitch, h, r0, spread, rmax, opt) {
    var k = 1 / Math.tan(pitch * Math.PI / 180);
    for (var i = 0; i < n; i++) {
      var rr = -h * Math.log(r() * r() + 1e-9); if (rr < r0 * 0.6 || rr > rmax) { i--; continue; }
      var arm = Math.floor(r() * m), th = Math.log(rr / r0) * k + arm * 6.2832 / m;
      if (opt && opt.lopsided && arm % 2) th += 0.35 * Math.sin(rr / R * 4);
      var sp = spread * (0.6 + rr / R) * (opt && opt.flocculent ? 2.2 : 1), off = gauss(r) * sp;
      var x = rr * Math.cos(th + off), y = rr * Math.sin(th + off), u = r();
      if (u < 0.03) nebula(x, y, sech2(r) * 0.08, 0.12 + Math.pow(r(), 3) * 0.5, r() < 0.12 ? OIII : HII, 0.008 + r() * 0.012);
      else if (u < 0.07) { var td = th - 0.22 * (0.6 + rr / R) + gauss(r) * spread * 0.3; nebula(rr * Math.cos(td), rr * Math.sin(td), sech2(r) * 0.12, 0.6 + r() * 1.4, DUST, 0.05 + r() * 0.05); }
      else star(x, y, sech2(r) * 0.18, 'young', 3.2);
    }
  }
  var k = g.kind;
  if (k === 'spiral' || k === 'barred') {
    var h = g.h * R, nb = Math.round(N * g.bulge), na = Math.round(N * 0.36), nd = N - nb - na - 2600;
    if (g.sats) nd -= Math.round(N * 0.06);
    if (g.companion) nd -= Math.round(N * 0.08);
    hernBlob(nb, R * 0.05, [1, 1, 0.62], 'old', 1.4, 0, 0, 0);
    if (k === 'barred') { // bar: a prolate block of old stars along x
      var nbar = Math.round(N * 0.07); nd -= nbar;
      for (var i = 0; i < nbar; i++) { var t = gauss(r) * 0.42, w = gauss(r) * 0.12; star(t * R * g.bar, w * R * g.bar, sech2(r) * 0.25, 'old', 1.3); }
    }
    disk(Math.max(0, nd), h, 0.33 * (R / 50), 'disk', 1, R * 1.05);
    arms(na, g.arms, g.pitch, h * 1.1, k === 'barred' ? R * g.bar * 0.55 : R * 0.12, 0.16, R * 1.0, g);
    if (g.ring) { for (var j = 0; j < 2600; j++) { var t2 = r() * 6.2832, rr2 = R * g.ring + gauss(r) * R * 0.03; if (r() < 0.25) nebula(rr2 * Math.cos(t2), rr2 * Math.sin(t2), sech2(r) * 0.1, 0.2 + r() * 0.6, HII, 0.06); else star(rr2 * Math.cos(t2), rr2 * Math.sin(t2), sech2(r) * 0.2, 'young', 3); } }
    else { for (var q = 0; q < 2600; q++) { var t3 = r() * 6.2832, rr3 = -h * Math.log(r() * r() + 1e-9); nebula(rr3 * Math.cos(t3), rr3 * Math.sin(t3), sech2(r) * 0.2, 0.5 + r() * 1.2, r() < 0.6 ? DUST : HII, 0.008); } }
    if (g.sats) { // M32 (compact, 6,500 ly) and M110 (17,000 ly), at their projected offsets
      hernBlob(Math.round(N * 0.025), 0.35, [1, 0.8, 0.8], 'old', 1.5, R * 0.3, -R * 0.12, R * 0.05);
      hernBlob(Math.round(N * 0.035), 2.2, [1, 0.6, 0.6], 'old', 1.1, -R * 0.55, R * 0.45, -R * 0.06);
    }
    if (g.companion) hernBlob(Math.round(N * 0.08), 3.5, [1, 0.85, 0.75], 'old', 1.3, R * 0.98, R * 0.62, -R * 0.08); // NGC 5195
    if (g.key === 'm33') for (var p = 0; p < 160; p++) nebula(R * 0.42 + gauss(r) * 0.6, R * 0.2 + gauss(r) * 0.6, gauss(r) * 0.1, 0.15 + r() * 0.5, HII, 0.03); // NGC 604
  } else if (k === 'irregular') { // LMC: off-centre bar, clumpy disk, the Tarantula
    var nbar2 = Math.round(N * 0.22);
    for (var b = 0; b < nbar2; b++) star(gauss(r) * R * 0.32 + R * 0.08, gauss(r) * R * 0.08, gauss(r) * 0.25, 'disk', 1.4);
    disk(Math.round(N * 0.4), R * 0.3, 0.35, 'disk', 1, R);
    for (var cl = 0; cl < 60; cl++) { var cx = gauss(r) * R * 0.45, cy = gauss(r) * R * 0.45, nn = Math.round(N * 0.0055); for (var s = 0; s < nn; s++) star(cx + gauss(r) * 0.8, cy + gauss(r) * 0.8, gauss(r) * 0.15, 'young', 3); }
    for (var tq = 0; tq < 900; tq++) nebula(R * 0.28 + gauss(r) * 0.9, R * 0.3 + gauss(r) * 0.7, gauss(r) * 0.2, 0.12 + Math.pow(r(), 2) * 0.8, tq % 5 ? HII : OIII, 0.022); // 30 Doradus
    for (var hh = 0; hh < 1800; hh++) nebula(gauss(r) * R * 0.5, gauss(r) * R * 0.5, gauss(r) * 0.2, 0.2 + r() * 0.7, r() < 0.6 ? HII : DUST, 0.012);
    disk(Math.max(0, N - B.n), R * 0.35, 0.3, 'young', 1.5, R);
  } else if (k === 'sombrero') {
    hernBlob(Math.round(N * 0.5), R * 0.09, [1, 1, 0.72], 'old', 1.6, 0, 0, 0);
    disk(Math.round(N * 0.22), R * 0.3, 0.15, 'disk', 1, R * 1.0);
    for (var dr = 0; dr < 6000; dr++) { var t4 = r() * 6.2832, rr4 = R * 0.62 + gauss(r) * R * 0.05; nebula(rr4 * Math.cos(t4), rr4 * Math.sin(t4), gauss(r) * 0.12, 0.5 + r() * 0.9, DUST, 0.09); }
    for (var gc = 0; gc < 2000; gc++) { var d2 = sphere(r), rr5 = hern(r, R * 0.3); star(d2[0] * rr5, d2[1] * rr5, d2[2] * rr5, 'old', 9); } // globular clusters
    hernBlob(Math.max(0, N - B.n), R * 0.2, [1, 1, 0.8], 'old', 0.8, 0, 0, 0);
  } else if (k === 'ringg') { // Cartwheel: outer ring of new stars, inner ring, spokes, nucleus
    for (var c1 = 0; c1 < N * 0.4; c1++) { var t5 = r() * 6.2832, rr6 = R * 0.9 + gauss(r) * R * 0.045; if (r() < 0.06) nebula(rr6 * Math.cos(t5), rr6 * Math.sin(t5), gauss(r) * 0.3, 0.4 + r() * 1.4, HII, 0.07); else star(rr6 * Math.cos(t5), rr6 * Math.sin(t5), gauss(r) * 0.4, 'young', 3.4); }
    for (var c2 = 0; c2 < N * 0.12; c2++) { var t6 = r() * 6.2832, rr7 = R * 0.26 + gauss(r) * R * 0.03; star(rr7 * Math.cos(t6), rr7 * Math.sin(t6), gauss(r) * 0.3, 'disk', 1.6); }
    for (var c3 = 0; c3 < N * 0.12; c3++) { var sp2 = Math.floor(r() * 14), t7 = sp2 * 0.4488 + gauss(r) * 0.03, rr8 = R * (0.3 + r() * 0.58); star(rr8 * Math.cos(t7), rr8 * Math.sin(t7), gauss(r) * 0.3, 'disk', 0.9); }
    hernBlob(Math.round(N * 0.08), R * 0.04, [1, 1, 0.8], 'old', 1.4, 0, 0, 0);
    disk(Math.max(0, N - B.n), R * 0.45, 0.4, 'disk', 0.4, R);
  } else { // elliptical

var route = [], X = 0;
function place(i) {
  var g = CAT[i % CAT.length], r = rng(1000 + i * 77), R = g.R, mw = g.key === 'mw' && i === 0;
  var alpha = (mw ? 2.2 : 8 + r() * 6) * Math.PI / 180, psi = r() * 6.2832, phi = r() * 6.2832;
  var n = [Math.sin(alpha), Math.cos(alpha) * Math.cos(psi), Math.cos(alpha) * Math.sin(psi)];
  var e1 = norm([1 - n[0] * n[0], -n[0] * n[1], -n[0] * n[2]]), e2 = cross(n, e1);
  var c = Math.cos(phi), s = Math.sin(phi), a1 = [e1[0] * c + e2[0] * s, e1[1] * c + e2[1] * s, e1[2] * c + e2[2] * s], a2 = cross(n, a1);
  var half = R * 1.05, impact = R * (mw ? 0.12 : 0.06 + r() * 0.05);
  var chord = 2 * half, start = mw ? -(26 * Math.cos(alpha)) : -half; // the Milky Way starts at the Sun, 26 kly from the centre
  var cx = X - start, centre = [cx, e2[1] * impact, e2[2] * impact];
  var cross_s = (half - start) / (chord / CROSS_S);
  var seg = { i: i, g: g, centre: centre, rot: new Float32Array([a1[0], a1[1], a1[2], a2[0], a2[1], a2[2], n[0], n[1], n[2]]), x0: X, x1: cx + half, t: cross_s, speed: chord / CROSS_S, cloud: null, ready: false };
  X = seg.x1; route.push(seg);
  return seg;
}
function gapAfter(seg) { var nx = CAT[(seg.i + 1) % CAT.length]; return 4.5 * (seg.g.R + nx.R) + 60; } // the void, compressed (render length)
place(0);

// clocks: absolute time in the route; each galaxy segment, then a void
var timeline = []; // [{kind, seg, t0, t1, x0, x1}]
function extend() {
  var last = route[route.length - 1], t0 = timeline.length ? timeline[timeline.length - 1].t1 : 0;
  timeline.push({ kind: 'in', seg: last, t0: t0, t1: t0 + last.t, x0: last.x0, x1: last.x1 });
  var G = gapAfter(last), x0 = last.x1; X = x0 + G;
  var next = place(route.length);
  var nxStart = next.x0; // place() has set it to the end of the gap
  timeline.push({ kind: 'gap', seg: last, next: next, t0: t0 + last.t, t1: t0 + last.t + GAP_S, x0: x0, x1: nxStart, sep: sep(last.g, next.g) });
}
extend();

// galaxies are built a slice per frame, so nothing stalls
var queue = [];
function want(seg) { if (!seg.cloud && !seg.building) { seg.building = true; queue.push(seg); } }
var building = null;
function work(budgetMs) {
  var t0 = performance.now();
  while (queue.length && performance.now() - t0 < budgetMs) {
    var seg = queue.shift(), g = seg.g, n = g.key === 'ic1101' ? Math.round(NSTARS * 1.1) : NSTARS;
    var res = build(g, n, 4242 + seg.i * 31); seg.cloud = makeCloud(res.data, res.count); seg.ready = true; seg.building = false;
  }
}
want(route[0]); work(1e9);

// camera position at time t (x along the route) and the derivative (speed, render units per s)
function hermite(p0, p1, m0, m1, u) { var u2 = u * u, u3 = u2 * u; return (2 * u3 - 3 * u2 + 1) * p0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * p1 + (u3 - u2) * m1; }
function at(t) {
  while (timeline[timeline.length - 1].t1 < t + 30) extend();
  for (var k = 0; k < timeline.length; k++) { var s = timeline[k]; if (t < s.t1) {
    var u = (t - s.t0) / (s.t1 - s.t0);
    if (s.kind === 'in') return { x: s.x0 + (s.x1 - s.x0) * u, v: (s.x1 - s.x0) / (s.t1 - s.t0), span: s, u: u };
    var D = s.t1 - s.t0, m0 = s.seg.speed * D, m1 = s.next.speed * D;
    var x = hermite(s.x0, s.x1, m0, m1, u), dx = hermite(s.x0, s.x1, m0, m1, Math.min(1, u + 1e-3)) - x;
    return { x: x, v: dx / (1e-3 * D), span: s, u: u };
  } }
}

// ---------------------------------------------------------------- HUD
var $ = function (id) { return document.getElementById(id); };
var hud = { now: $('now'), name: $('name'), sub: $('sub'), bar: $('bar'), dist: $('dist'), left2: $('left2'), speed: $('speed'), side2: $('side2') }, shownKey = '', crossed = 0, lastSpan = null;
function setHud(state) {
  var s = state.span, key = s.kind + s.seg.i;
  if (key !== shownKey) {
    shownKey = key; var g = s.seg.g;
    {
      if (s.kind === 'in') {
        hud.now.textContent = s.seg.i === 0 ? 'You are in' : 'Now crossing';
        hud.name.textContent = g.name;
        hud.sub.innerHTML = '<b>' + g.id + '</b> · ' + g.type + ' · <b>' + g.diam.toLocaleString('en-US') + ' ly</b> across · ' + (g.key === 'mw' ? 'home' : '<b>' + ly(g.dist) + '</b> from Earth') + '<br>' + g.note;
      } else {
        var nx = s.next.g;
        hud.now.textContent = 'Intergalactic space';
        hud.name.textContent = '→ ' + nx.name;
        hud.sub.innerHTML = 'Leaving ' + g.name + ' · <b>' + ly(s.sep) + '</b> to ' + nx.name + ' (' + nx.id + ')';
      }
      var nm = hud.name; nm.style.animation = 'none'; void nm.offsetWidth; nm.style.animation = '';
    }
  }
}

// ---------------------------------------------------------------- frame
var jump = +(new URLSearchParams(location.search).get("t") || 0), start = performance.now() - jump * 1000, last = start, prevVP = null, prevCam = null, steer = [0, 0], steerT = [0, 0];
addEventListener('pointermove', function (e) { steerT = [(e.clientX / innerWidth - 0.5) * 2, (e.clientY / innerHeight - 0.5) * 2]; }, { passive: true });
var V = new Float32Array(16);
function drawCloud(cloud, rot, off, offP, VP, PVP, lum, fade) {
  var u = P.star.u; gl.uniformMatrix3fv(u.uRot, false, rot); gl.uniform3fv(u.uOff, off); gl.uniform3fv(u.uOffP, offP); gl.uniform1f(u.uLum, lum); gl.uniform1f(u.uFade, fade);
  gl.bindVertexArray(cloud.vao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, cloud.count);
}
function pass(prg, target, setup) { gl.useProgram(prg.p); gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.f : null); gl.viewport(0, 0, target ? target.w : W, target ? target.h : H); setup(prg.u); gl.drawArrays(gl.TRIANGLES, 0, 3); }
function bind(unit, t, loc) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(loc, unit); }

function frame(now) {
  requestAnimationFrame(frame);
  resize();
  var t = (now - start) / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
  var st = at(t), span = st.span;
  // build the next galaxy early in the crossing, so it is ready long before the void
  for (var q = 0; q < route.length; q++) { var sg = route[q]; if (sg.i >= span.seg.i && sg.i <= span.seg.i + 1) want(sg); }
  work(6);
  // free galaxies far behind
  route.forEach(function (sg) { if (sg.cloud && sg.i < span.seg.i - 1) { freeCloud(sg.cloud); sg.cloud = null; } });

  // camera: along +x, a slow drift and a little steering from the pointer; a gentle roll
  steer[0] += (steerT[0] - steer[0]) * Math.min(1, dt * 1.5); steer[1] += (steerT[1] - steer[1]) * Math.min(1, dt * 1.5);
  var yaw = 0.07 * Math.sin(t * 0.061) + steer[0] * 0.16, pitch = 0.05 * Math.sin(t * 0.047 + 1) - steer[1] * 0.1, roll = 0.08 * Math.sin(t * 0.033);
  var fw = norm([Math.cos(yaw) * Math.cos(pitch), Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch)]), up = norm([-Math.sin(roll) * 0.0 + 0, Math.sin(roll), Math.cos(roll)]);
  var cam = [st.x, 0, 0];
  var fov = 1.2 + (span.kind === 'gap' ? Math.sin(Math.PI * st.u) * 0.28 : 0), asp = W / H;
  var VP = mul(persp(fov, asp, 0.0005, 1e7), lookDir(fw, up));
  if (!prevVP) { prevVP = VP; prevCam = cam; }
  var focal = H / 2 / Math.tan(fov / 2);

  // ---- scene into the HDR target
  gl.bindFramebuffer(gl.FRAMEBUFFER, T.hdr.f); gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.disable(gl.DEPTH_TEST);
  gl.useProgram(P.star.p); var u = P.star.u;
  gl.uniformMatrix4fv(u.uVP, false, VP); gl.uniformMatrix4fv(u.uPVP, false, prevVP); gl.uniform2f(u.uRes, W, H); gl.uniform1f(u.uFocal, focal);
  var I3 = new Float32Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);
  drawCloud(field, I3, [0, 0, 0], [0, 0, 0], VP, prevVP, 1, 1);
  route.forEach(function (sg) {
    if (!sg.cloud) return; var dx = sg.centre[0] - cam[0]; if (Math.abs(dx) > sg.g.R * 30 + 400) return;
    var off = [sg.centre[0] - cam[0], sg.centre[1] - cam[1], sg.centre[2] - cam[2]], offP = [sg.centre[0] - prevCam[0], sg.centre[1] - prevCam[1], sg.centre[2] - prevCam[2]];
    drawCloud(sg.cloud, sg.rot, off, offP, VP, prevVP, 140, 1);
  });
  if (span.kind === 'gap') { // the void's stars, stretched over the compressed gap
    var G = span.x1 - span.x0, mid = (span.x0 + span.x1) / 2, sc = new Float32Array([G, 0, 0, 0, G * 0.06 + 20, 0, 0, 0, G * 0.06 + 20]);
    drawCloud(voidStars, sc, [mid - cam[0], 0, 0], [mid - prevCam[0], 0, 0], VP, prevVP, 3 + G * 0.01, Math.sin(Math.PI * st.u));
  }
  gl.disable(gl.BLEND);
  drawDance(t, fov, asp, norm([0.55, 0.45, -0.7]));

  // ---- bloom: two levels
  pass(P.down, T.a1, function (u) { bind(0, T.hdr.t, u.t); gl.uniform2f(u.px, 1 / W, 1 / H); gl.uniform1f(u.thr, 0.35); });
  pass(P.blur, T.b1, function (u) { bind(0, T.a1.t, u.t); gl.uniform2f(u.dir, 1.6 / T.a1.w, 0); });
  pass(P.blur, T.a1, function (u) { bind(0, T.b1.t, u.t); gl.uniform2f(u.dir, 0, 1.6 / T.a1.h); });
  pass(P.down, T.a2, function (u) { bind(0, T.a1.t, u.t); gl.uniform2f(u.px, 1 / T.a1.w, 1 / T.a1.h); gl.uniform1f(u.thr, 0); });
  pass(P.blur, T.b2, function (u) { bind(0, T.a2.t, u.t); gl.uniform2f(u.dir, 1.8 / T.a2.w, 0); });
  pass(P.blur, T.a2, function (u) { bind(0, T.b2.t, u.t); gl.uniform2f(u.dir, 0, 1.8 / T.a2.h); });
  pass(P.comp, null, function (u) { bind(0, T.hdr.t, u.tHdr); bind(1, T.a1.t, u.tB1); bind(2, T.a2.t, u.tB2); gl.uniform1f(u.uTime, t); gl.uniform1f(u.uExp, 1.6); gl.uniform1f(u.uWarp, span.kind === 'gap' ? Math.sin(Math.PI * st.u) : 0); gl.uniform2f(u.uRes, W, H); });
  prevVP = VP; prevCam = cam;

  // ---- numbers (real units: the render unit is 1,000 ly, so the real speed is v_render * 1000 ly per second)
  setHud(st);
  var lyPerS, crossedNow;
  if (span.kind === 'in') {
    lyPerS = st.v * 1000;
    hud.bar.style.width = (st.u * 100).toFixed(2) + '%';
    hud.left2.textContent = 'Crossing ' + mmss(t - span.t0) + ' / ' + mmss(span.t1 - span.t0) + ' · 1 s = ' + Math.round(lyPerS).toLocaleString('en-US') + ' ly';
  } else {
    var real = span.sep, frac = (st.x - span.x0) / (span.x1 - span.x0);
    lyPerS = st.v / (span.x1 - span.x0) * real; // the same fraction of the true separation per second
    hud.bar.style.width = (frac * 100).toFixed(2) + '%';
    hud.left2.textContent = ly(real * (1 - frac)) + ' to go';
  }
  crossed = 0; for (var k2 = 0; k2 < timeline.length && timeline[k2] !== span; k2++) crossed += timeline[k2].kind === 'in' ? (timeline[k2].x1 - timeline[k2].x0) * 1000 : timeline[k2].sep;
  crossedNow = crossed + (span.kind === 'in' ? (st.x - span.x0) * 1000 : span.sep * (st.x - span.x0) / (span.x1 - span.x0));
  hud.dist.textContent = ly(crossedNow);
  hud.speed.textContent = sci(lyPerS * YEAR_S) + ' c';
  hud.side2.textContent = ly(lyPerS) + ' per second';
}
requestAnimationFrame(frame);
})();
</script>
