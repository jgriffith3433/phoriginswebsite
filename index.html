// Talking to the page. A visitor types or speaks a question; the answer comes back as text and is read aloud in the
// voice of the side they are on. The server (D.chat) is told which scale and which side, so the page knows what it is
// showing. Replies are spoken with the browser's own voice (a different one on the back of the page). The pictures are
