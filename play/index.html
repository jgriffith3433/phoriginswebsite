<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08131d" />
    <title>PH Origins</title>
    <style>
      :root {
        --bg: #07141e;
        --panel: rgba(10, 18, 28, 0.82);
        --border: rgba(255,255,255,0.12);
        --text: #eefaff;
        --muted: #9bb0c1;
        --accent: #67d2ff;
        --good: #7af0c9;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #102637 0%, #07141e 45%, #030a10 100%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .panel {
        width: min(560px, calc(100vw - 32px));
        padding: 36px 28px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: rgba(7, 14, 20, 0.82);
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--good);
        letter-spacing: 0.28rem;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(38px, 8vw, 64px);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 16px;
      }

      .button-wrap {
        margin-top: 26px;
        display: flex;
        justify-content: center;
      }

      .play-btn {
        display: inline-block;
        padding: 16px 26px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--good));
        color: #07141e;
        text-decoration: none;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.2rem;
        text-transform: uppercase;
        box-shadow: 0 16px 34px rgba(103, 210, 255, 0.28);
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="eyebrow">PH Origins</div>
      <h1>Ready to play?</h1>
      <p>Launch the 3D game and dive straight into the arena.</p>
      <div class="button-wrap">
        <a class="play-btn" href="./play/index.html">Play now</a>
      </div>
    </main>
  </body>
</html>
