# Builds the game (npm run build -> play/) and publishes the whole site to GitHub Pages, so going live is just pushing
# main: nobody has to rebuild play/ and commit it first. Settings > Pages > Source must be "GitHub Actions"; Hawkes
# Studio switches it the first time this workflow reaches main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build version for Hawkes Analytics
        run: |
          echo "HAWKES_BUILD_VERSION=$(node -p "require('./releases.json').current")" >> "$GITHUB_ENV"
          echo "HAWKES_BUILD_COMMIT=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "HAWKES_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Assemble site
        run: |
          # The site as Pages served it from the repo (every tracked file), with play/ freshly built.
          mkdir _site
          git ls-files -z | grep -zv '^\.github/' | xargs -0 cp --parents -t _site
          rm -rf _site/play
          cp -r play _site/play
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
