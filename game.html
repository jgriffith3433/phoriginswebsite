<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#08131d" />
    <meta name="description" content="PH Origins 3D game" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>PH Origins 3D</title>
    <style>
      :root {
        --bg: #05080c;
        --panel: rgba(8, 12, 16, 0.86);
        --panel-border: rgba(212, 180, 131, 0.28);
        --text: #f3f1ea;
        --muted: #b7c0c8;
        --accent: #67d2ff;
        --good: #7af0c9;
        --gold: #d4b483;
        --warning: #ffd86a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-root {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(180deg, #091722 0%, #040b11 100%);
        --ui-scale: 1;
        --safe-top: 0px;
        --safe-bottom: 0px;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
      }

      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        transform: translate(-50%, -50%);
        z-index: 5;
        pointer-events: none;
      }

      #devToggle {
        position: absolute;
        top: calc(var(--safe-top) + 18px);
        right: 18px;
        z-index: 11;
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 999px;
        background: rgba(10, 20, 31, 0.72);
        color: var(--text);
        font-size: 10px;
        letter-spacing: 0.18rem;
        font-weight: 800;
        text-transform: uppercase;
        padding: 10px 14px;
        cursor: pointer;
        backdrop-filter: blur(8px);
      }

      #devPanel {
        position: absolute;
        top: calc(var(--safe-top) + 64px);
        right: 18px;
        z-index: 12;
        width: min(320px, calc(100vw - 36px));
        padding: 14px;
        border-radius: 18px;
        background: rgba(5, 10, 16, 0.88);
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text);
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        display: none;
      }

      #devPanel.visible {
        display: block;
      }

      .dev-title {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.2rem;
        text-transform: uppercase;
        color: var(--good);
      }

      .dev-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }

      .dev-stat {
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        padding: 8px 10px;
      }

      .dev-stat .label {
        display: block;
        font-size: 9px;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        color: var(--muted);
      }

      .dev-stat .value {
        display: block;
        margin-top: 4px;
        font-size: 18px;
        font-weight: 800;
      }

      .dev-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .dev-actions button,
      .dev-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 1 1 calc(50% - 8px);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.1rem;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--text);
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        cursor: pointer;
      }

      .dev-actions .primary {
        background: linear-gradient(135deg, var(--accent), var(--good));
        color: #07141e;
      }

      .dev-output {
        margin-top: 12px;
        width: 100%;
        min-height: 96px;
        padding: 8px 10px;
        border-radius: 10px;
        resize: vertical;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.02);
        color: var(--text);
      }

      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255,255,255,0.9);
        box-shadow: 0 0 12px rgba(103, 210, 255, 0.7);
      }

      #crosshair::before {
        left: 12px;
        top: 0;
        width: 2px;
        height: 26px;
      }

      #crosshair::after {
        left: 0;
        top: 12px;
        width: 26px;
        height: 2px;
      }

      button.reload-hint,
      button.interact-hint {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        z-index: 7;
        pointer-events: auto;
        touch-action: manipulation;
        cursor: pointer;
        color: #f3efe6;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
        background: rgba(8, 10, 14, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        padding: 8px 14px;
        white-space: nowrap;
      }

      button.reload-hint:hover,
      button.interact-hint:hover,
      button.reload-hint:active,
      button.interact-hint:active {
        transform: translateX(-50%);
      }

      .reload-hint kbd,
      .interact-hint kbd {
        font: inherit;
        letter-spacing: inherit;
        color: inherit;
      }

      body[data-device='mobile'] button.reload-hint,
      body[data-device='mobile'] button.interact-hint,
      body[data-device='tablet'] button.reload-hint,
      body[data-device='tablet'] button.interact-hint {
        min-height: 44px;
        padding: 12px 20px;
        font-size: 13px;
      }

      .reload-hint {
        top: calc(50% + 42px);
      }

      .interact-hint {
        top: calc(50% + 86px);
        color: #f0d48a;
      }

      .perf-monitor {
        position: absolute;
        left: 50%;
        bottom: calc(var(--safe-bottom) + 14px);
        transform: translateX(-50%);
        z-index: 11;
        pointer-events: none;
        display: flex;
        gap: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(8, 12, 16, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: calc(11px * var(--ui-scale, 1));
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--text);
      }

      .perf-monitor .perf-k {
        color: var(--muted);
        margin-right: 4px;
      }

      #perfFps[data-band='high'] { color: var(--good); }
      #perfFps[data-band='mid'] { color: var(--warning); }
      #perfFps[data-band='low'] { color: #ff5d6c; }

      .hud {
        position: absolute;
        top: calc(var(--safe-top) + 16px);
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        pointer-events: none;
        z-index: 2;
      }

      .brand {
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(10, 20, 31, 0.48);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(8px);
        letter-spacing: 0.28rem;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
      }

      .stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-right: 72px;
      }

      .stat {
        min-width: 110px;
        text-align: center;
        padding: 10px 12px;
        border-radius: 16px;
        background: rgba(10, 20, 31, 0.48);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(8px);
      }

      .health-stat {
        min-width: 168px;
        text-align: left;
      }

      .health-bar {
        width: 148px;
        height: 10px;
        margin-top: 6px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.38);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .health-fill {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: var(--good);
        transition: width 0.16s ease, background-color 0.16s ease;
      }

      .health-fill[data-band='mid'] {
        background: var(--warning);
      }

      .health-fill[data-band='low'] {
        background: #ff5d6c;
      }

      .label {
        display: block;
        font-size: 9px;
        letter-spacing: 0.18rem;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 2px;
      }

      .value {
        display: block;
        font-size: 22px;
        font-weight: 800;
      }

      body[data-device='desktop'] .controls {
        display: none;
      }

      .objective-hud {
        position: absolute;
        top: calc(var(--safe-top) + 76px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        pointer-events: none;
        display: none;
        min-width: 260px;
        max-width: min(420px, calc(100% - 32px));
        text-align: center;
        padding: 10px 16px;
        border-radius: 16px;
        background: rgba(10, 20, 31, 0.52);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(8px);
      }

      .objective-hud.visible {
        display: block;
      }

      .objective-kicker {
        display: block;
        font-size: 9px;
        letter-spacing: 0.22rem;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 4px;
      }

      .objective-text {
        display: block;
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }

      .objective-dist {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }

      .alarm-flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 7;
        display: none;
        background: radial-gradient(ellipse at center, rgba(180, 16, 28, 0) 40%, rgba(150, 8, 18, 0.28) 100%);
        animation: alarmPulse 0.65s ease-in-out infinite;
      }

      .alarm-flash.visible {
        display: block;
      }

      @keyframes alarmPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }

      .phone-hint {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
        padding: 8px 12px;
        border-radius: 12px;
        background: rgba(10, 20, 31, 0.54);
        border: 1px solid var(--panel-border);
        color: var(--text);
        backdrop-filter: blur(8px);
        font-family: inherit;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14rem;
        text-transform: uppercase;
        pointer-events: auto;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        min-width: 132px;
        box-sizing: border-box;
        touch-action: manipulation;
        user-select: none;
      }

      .phone-hint kbd {
        display: inline-block;
        min-width: 1.4em;
        padding: 2px 5px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.08);
        font: inherit;
        font-size: 11px;
        letter-spacing: 0;
        line-height: 1.2;
      }

      .phone-hint.raised,
      .phone-hint.lit {
        border-color: rgba(212, 180, 131, 0.7);
        color: var(--gold);
      }

      .phone-hint.drawn {
        border-color: rgba(122, 240, 201, 0.55);
        box-shadow: 0 0 0 1px rgba(122, 240, 201, 0.18);
      }

      .phone-hint.ringing {
        animation: alarmPulse 0.7s ease-in-out infinite;
        border-color: var(--gold);
        color: var(--gold);
      }

      .phone-badge {
        min-width: 1.2em;
        padding: 1px 5px;
        border-radius: 999px;
        background: var(--gold);
        color: #1a140c;
        letter-spacing: 0;
        font-size: 11px;
      }

      .phone-panel {
        position: absolute;
        left: 28px;
        top: 18%;
        width: min(340px, calc(100vw - 48px));
        z-index: 9;
        pointer-events: auto;
        color: var(--text);
      }

      .phone-panel.focused {
        top: 12%;
        width: min(420px, 42vw);
      }

      .phone-bezel {
        padding: 18px 18px 16px;
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(12, 16, 20, 0.94), rgba(6, 8, 12, 0.92));
        border: 1px solid rgba(212, 180, 131, 0.45);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }

      .phone-status {
        font-size: 11px;
        letter-spacing: 0.18rem;
        text-transform: uppercase;
        color: var(--gold);
      }

      .phone-contact {
        margin-top: 8px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.04rem;
      }

      .phone-detail,
      .phone-clock,
      .phone-speaker {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
      }

      .phone-line {
        min-height: 3.2em;
        margin: 14px 0 0;
        font-size: 18px;
        line-height: 1.35;
        color: var(--text);
      }

      .phone-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .phone-actions button {
        appearance: none;
        flex: 1;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid rgba(212, 180, 131, 0.45);
        background: rgba(212, 180, 131, 0.12);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        cursor: pointer;
      }

      .phone-actions button.answer {
        background: #1f6b45;
        border-color: #7af0c9;
      }

      .phone-actions button.end {
        background: #6b2430;
        border-color: #e07a86;
      }

      .phone-actions button.on {
        color: var(--gold);
        border-color: var(--gold);
      }

      .phone-messages {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 14px;
      }

      .phone-message {
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
      }

      .phone-message strong {
        display: block;
        font-size: 11px;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        color: var(--gold);
      }

      .phone-empty {
        color: var(--muted);
        font-size: 13px;
      }

      .phone-toast {
        position: absolute;
        left: 50%;
        top: calc(var(--safe-top, 0px) + 92px);
        transform: translateX(-50%);
        z-index: 9;
        min-width: 220px;
        max-width: min(420px, calc(100vw - 48px));
        padding: 10px 14px;
        border-radius: 14px;
        background: rgba(8, 12, 16, 0.92);
        border: 1px solid rgba(212, 180, 131, 0.55);
        color: var(--text);
        text-align: center;
        letter-spacing: 0.04rem;
        pointer-events: none;
      }

      .inventory-hud {
        position: absolute;
        right: 18px;
        bottom: calc(var(--safe-bottom) + 118px);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        z-index: 8;
        pointer-events: none;
      }

      .inventory-hint,
      .inventory-close,
      .weapon-slot {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
        padding: 8px 12px;
        border-radius: 12px;
        background: rgba(10, 20, 31, 0.54);
        border: 1px solid var(--panel-border);
        color: var(--text);
        backdrop-filter: blur(8px);
        font-family: inherit;
        font-weight: 800;
        letter-spacing: 0.14rem;
        text-transform: uppercase;
        transform: none;
      }

      .inventory-hint {
        font-size: 10px;
        text-align: left;
        pointer-events: auto;
        cursor: pointer;
      }

      .inventory-hint kbd {
        display: inline-block;
        min-width: 1.4em;
        padding: 2px 5px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.08);
        font: inherit;
        font-size: 11px;
        letter-spacing: 0;
        line-height: 1.2;
      }

      .inventory-panel {
        display: none;
        width: min(260px, calc(100vw - 36px));
        padding: 10px;
        border-radius: 16px;
        background: rgba(10, 20, 31, 0.78);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(10px);
        pointer-events: auto;
        gap: 8px;
        flex-direction: column;
      }

      .inventory-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .inventory-panel-title {
        font-size: 10px;
        letter-spacing: 0.16rem;
        text-transform: uppercase;
        color: var(--muted);
      }

      .inventory-close {
        min-width: 36px;
        font-size: 16px;
        letter-spacing: 0;
        line-height: 1;
        cursor: pointer;
      }

      .weapon-slot {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        width: 100%;
        text-align: left;
        cursor: pointer;
        padding: 10px 12px;
      }

      .weapon-slot.drawn {
        border-color: rgba(122, 240, 201, 0.55);
        box-shadow: 0 0 0 1px rgba(122, 240, 201, 0.18);
      }

      .weapon-slot:disabled {
        cursor: default;
        opacity: 0.7;
      }

      .weapon-slot strong {
        font-size: 16px;
        letter-spacing: 0.08rem;
      }

      .weapon-state {
        font-size: 10px;
        letter-spacing: 0.12rem;
        color: var(--muted);
      }

      .weapon-slot.drawn .weapon-state {
        color: var(--good);
      }

      .inventory-items {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .inventory-hud.open .inventory-hint {
        display: none;
      }

      .inventory-hud.open .inventory-panel {
        display: flex;
      }

      .inventory-item {
        min-width: 0;
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(10, 14, 18, 0.54);
        border: 1px solid var(--panel-border);
        text-align: left;
        pointer-events: none;
      }

      .inventory-label {
        display: block;
        font-size: 9px;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        color: var(--muted);
      }

      .inventory-item strong {
        display: block;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--text);
      }

      .inventory-note {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.35;
        color: var(--muted);
      }

      .controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(var(--safe-bottom) + 18px);
        display: flex;
        justify-content: space-between;
        align-items: end;
        padding: 0 14px;
        pointer-events: none;
        z-index: 2;
      }

      .left-stick-zone {
        position: relative;
        width: 150px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        touch-action: none;
      }

      .stick-ring {
        position: relative;
        width: 118px;
        height: 118px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(13, 20, 31, 0.42);
        box-shadow: inset 0 0 18px rgba(255,255,255,0.04);
      }

      .stick-ring::before {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: linear-gradient(135deg, rgba(103, 210, 255, 0.9), rgba(122, 240, 201, 0.8));
        border: 1px solid rgba(255,255,255,0.22);
        box-shadow: 0 0 20px rgba(103, 210, 255, 0.45);
      }

      .right-controls {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        pointer-events: auto;
      }

      .right-stick-zone {
        position: relative;
        width: 132px;
        height: 132px;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }

      .right-action-zone {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .touch-btn {
        width: 72px;
        height: 72px;
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 50%;
        background: rgba(13, 20, 31, 0.52);
        color: var(--text);
        font-size: 28px;
        font-weight: 700;
        touch-action: manipulation;
        user-select: none;
      }

      .touch-btn:active {
        transform: scale(0.97);
      }

      .action-btn {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.16);
        background: linear-gradient(135deg, var(--accent), var(--good));
        color: #07141e;
        font-weight: 900;
        font-size: 24px;
        pointer-events: auto;
      }

      .action-btn.fire {
        background: linear-gradient(135deg, #ffbf69, #ff7a59);
        color: #23120d;
      }

      #screenFade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 8;
      }

      .message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(3, 8, 14, 0.4);
        z-index: 10;
      }

      .message.hidden {
        display: none;
      }

      body:has(.message:not(.hidden)) .inventory-hud {
        visibility: hidden;
      }

      .level-credits {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 86%, transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 86%, transparent 100%);
      }

      .level-credits[hidden] {
        display: none;
      }

      .credit-roll {
        position: absolute;
        top: 100%;
        width: min(220px, max(108px, calc((100vw - min(100vw, 460px)) / 2 - 2rem)));
        animation: creditCrawl 82s linear forwards;
      }

      .credit-roll-left {
        left: max(12px, env(safe-area-inset-left, 0px));
        margin-left: calc(2.2vw * var(--ui-scale, 1));
        text-align: left;
      }

      .credit-roll-right {
        right: max(12px, env(safe-area-inset-right, 0px));
        margin-right: calc(2.2vw * var(--ui-scale, 1));
        text-align: right;
        animation-delay: 7s;
      }

      .credit-block {
        margin: 0 0 calc(2.6em * var(--ui-scale, 1));
      }

      .credit-role {
        margin: 0 0 0.4em;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(9px, calc(0.55rem * var(--ui-scale, 1) + 0.45vw), calc(13px * var(--ui-scale, 1)));
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(212, 180, 131, 0.82);
      }

      .credit-roll-left .credit-role {
        padding-left: 0.28em;
      }

      .credit-name {
        margin: 0.06em 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(14px, calc(0.7rem * var(--ui-scale, 1) + 1.15vw), calc(28px * var(--ui-scale, 1)));
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #f4f1ea;
        line-height: 1.15;
        text-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
        overflow-wrap: break-word;
      }

      @keyframes creditCrawl {
        from { transform: translateY(0); }
        to { transform: translateY(calc(-100% - 100vh)); }
      }

      @media (max-width: 720px) {
        .credit-roll {
          width: 36vw;
          max-width: none;
        }

        .credit-roll-left {
          margin-left: 3vw;
        }

        .credit-roll-right {
          margin-right: 3vw;
        }

        .credit-role {
          font-size: clamp(8px, 2.4vw, 11px);
          letter-spacing: 0.16em;
        }

        .credit-name {
          font-size: clamp(13px, 3.5vw, 18px);
          letter-spacing: 0.03em;
        }
      }

      .panel {
        position: relative;
        z-index: 1;
        max-width: 440px;
        padding: 28px 24px;
        border-radius: 24px;
        border: 1px solid var(--panel-border);
        background: rgba(5, 10, 16, 1);
        text-align: center;
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.32rem;
        text-transform: uppercase;
        color: var(--good);
        margin-bottom: 10px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(36px, 5vw, 56px);
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .hidden {
        display: none !important;
      }

      .level-select {
        margin-top: 16px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 16px;
        background: rgba(17, 26, 36, 0.82);
        padding: 14px;
      }

      .level-select-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .level-select-header h2 {
        margin: 0;
        font-size: 18px;
      }

      .level-list {
        display: grid;
        gap: 10px;
      }

      .level-item {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }

      .level-item.locked,
      .level-item.coming-soon {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .level-item strong {
        display: block;
        font-size: 15px;
      }

      .level-item small {
        display: block;
        color: var(--muted);
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18rem;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), var(--good));
        color: #07141e;
      }

      .primary:disabled,
      .secondary:disabled {
        opacity: 0.45;
        cursor: wait;
        transform: none;
      }

      #loadModelBtn:disabled {
        cursor: not-allowed;
      }

      .secondary {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text);
      }

      body[data-device='mobile'] .hud,
      body[data-device='tablet'] .hud {
        left: 10px;
        right: 10px;
        top: calc(var(--safe-top) + 10px);
      }

      body[data-device='mobile'] .stats,
      body[data-device='tablet'] .stats {
        gap: 6px;
      }

      body[data-device='mobile'] .stat,
      body[data-device='tablet'] .stat {
        min-width: 76px;
        padding: 8px 10px;
      }

      body[data-device='mobile'] .brand,
      body[data-device='tablet'] .brand {
        letter-spacing: 0.12rem;
        font-size: 9px;
        padding: 8px 12px;
      }

      body[data-device='mobile'] .controls,
      body[data-device='tablet'] .controls {
        padding: 0 12px;
      }

      body[data-device='mobile'] .touch-btn,
      body[data-device='tablet'] .touch-btn {
        width: 62px;
        height: 62px;
        font-size: 22px;
      }

      body[data-device='mobile'] .action-btn,
      body[data-device='tablet'] .action-btn {
        width: 80px;
        height: 80px;
        font-size: 22px;
      }

      body[data-device='mobile'] kbd {
        display: none;
      }

      body[data-device='mobile'] .inventory-hud,
      body[data-device='tablet'] .inventory-hud {
        bottom: calc(var(--safe-bottom) + 236px);
      }

      @media (orientation: landscape) and (max-height: 520px) {
        .hud {
          top: calc(var(--safe-top) + 8px);
        }

        .stat {
          min-width: 70px;
          padding: 6px 8px;
        }

        .brand {
          letter-spacing: 0.18rem;
          font-size: 9px;
          padding: 7px 10px;
        }

        .controls {
          bottom: calc(var(--safe-bottom) + 10px);
        }

        .touch-btn {
          width: 54px;
          height: 54px;
          font-size: 18px;
        }

        .action-btn {
          width: 68px;
          height: 68px;
          font-size: 18px;
        }

        body[data-device='mobile'] .inventory-hud,
        body[data-device='tablet'] .inventory-hud {
          bottom: calc(var(--safe-bottom) + 148px);
          gap: 4px;
        }
      }

      @media (max-width: 600px) {
        .brand {
          letter-spacing: 0.18rem;
          font-size: 10px;
        }

        .stat {
          min-width: 92px;
        }

        .touch-btn {
          width: 62px;
          height: 62px;
          font-size: 22px;
        }

        .action-btn {
          width: 80px;
          height: 80px;
          font-size: 22px;
        }
      }
    </style>
    <script data-goatcounter="https://phorigins.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div id="game-root">
      <div class="hud">
        <div class="brand">PH ORIGINS</div>
        <div class="stats">
          <div class="stat health-stat">
            <span class="label">Health</span>
            <div class="health-bar" id="healthBar" role="progressbar" aria-label="Health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <span class="health-fill" id="healthFill" data-band="high"></span>
            </div>
          </div>
        </div>
      </div>

      <div id="perfMonitor" class="perf-monitor" aria-hidden="true">
        <span><span class="perf-k">FPS</span><span id="perfFps">—</span></span>
        <span><span class="perf-k">MEM</span><span id="perfMem">—</span></span>
      </div>

      <div id="crosshair" aria-hidden="true"></div>
      <button type="button" id="reloadHint" class="reload-hint" hidden>Reload<kbd> — R</kbd></button>
      <button type="button" id="interactHint" class="interact-hint" hidden>Ammo box<kbd> — E</kbd></button>
      <div id="objectiveHud" class="objective-hud" aria-live="polite">
        <span class="objective-kicker">Objective</span>
        <span id="objectiveText" class="objective-text"></span>
        <span id="objectiveDist" class="objective-dist"></span>
      </div>
      <div id="alarmFlash" class="alarm-flash" aria-hidden="true"></div>
      <aside id="phonePanel" class="phone-panel" hidden>
        <div class="phone-bezel">
          <div id="phoneStatus" class="phone-status">Phone</div>
          <div id="phoneContact" class="phone-contact"></div>
          <div id="phoneDetail" class="phone-detail"></div>
          <div id="phoneClock" class="phone-clock"></div>
          <div id="phoneSpeaker" class="phone-speaker"></div>
          <p id="phoneLine" class="phone-line"></p>
          <div class="phone-actions">
            <button type="button" id="phoneAnswer" class="answer" hidden>Answer</button>
            <button type="button" id="phoneEnd" class="end" hidden>End</button>
            <button type="button" id="phoneFlash" hidden>Flashlight</button>
          </div>
          <div id="phoneMessages" class="phone-messages"></div>
        </div>
      </aside>
      <div id="phoneToast" class="phone-toast" hidden></div>

      <div id="inventoryHud" class="inventory-hud" aria-live="polite">
        <button type="button" id="sidearmHint" class="phone-hint" aria-label="Sidearm"><kbd>Q</kbd> Sidearm</button>
        <button type="button" id="lightHint" class="phone-hint" aria-label="Flashlight"><kbd>G</kbd> Light</button>
        <button type="button" id="medkitHint" class="phone-hint" aria-label="Medkit"><kbd>H</kbd> Medkit</button>
        <button type="button" id="phoneHint" class="phone-hint" aria-label="Phone"><kbd>F</kbd> Phone <span id="phoneBadge" class="phone-badge" hidden></span></button>
        <button type="button" id="inventoryHint" class="inventory-hint phone-hint" aria-label="Open inventory"><kbd>I</kbd> Inventory</button>
        <div id="inventoryPanel" class="inventory-panel">
          <div class="inventory-panel-header">
            <span class="inventory-panel-title">Inventory</span>
            <button type="button" id="inventoryClose" class="inventory-close" aria-label="Close inventory">›</button>
          </div>
          <button type="button" id="weaponSlot" class="weapon-slot" aria-pressed="false" aria-label="Sidearm">
            <span class="inventory-label">Weapon</span>
            <strong id="weaponSlotName">Sidearm</strong>
            <span id="weaponSlotState" class="weapon-state">Holstered</span>
          </button>
          <div id="inventoryItems" class="inventory-items"></div>
        </div>
      </div>

      <button id="devToggle" type="button" hidden aria-label="Toggle developer tools">DEV</button>
      <aside id="devPanel" aria-live="polite">
        <h2 class="dev-title">Dev Tools</h2>
        <div class="dev-grid">
          <div class="dev-stat">
            <span class="label">FPS</span>
            <span class="value" id="devFps">0</span>
          </div>
          <div class="dev-stat">
            <span class="label">Health</span>
            <span class="value" id="devHealth">100</span>
          </div>
          <div class="dev-stat">
            <span class="label">Level</span>
            <span class="value" id="devLevel">1</span>
          </div>
        </div>
        <div class="dev-actions">
          <button class="primary" type="button" data-dev-action="reset">Reset</button>
          <button type="button" data-dev-action="hp">HP 100</button>
          <button type="button" data-dev-action="level">+1 Level</button>
          <button type="button" data-dev-action="pause">Pause</button>
          <button type="button" data-dev-action="audio">Audio</button>
          <button type="button" data-dev-action="lighting">Lighting</button>
          <a href="/devtools.html" target="_blank" rel="noreferrer">Open Page</a>
        </div>
        <textarea id="devOutput" class="dev-output" readonly></textarea>
      </aside>

      <div class="controls">
        <div class="left-stick-zone" id="leftStickZone" aria-label="Movement stick">
          <div class="stick-ring">
            <div class="stick-knob" id="leftStickKnob"></div>
          </div>
        </div>

        <div class="right-controls">
          <div class="right-stick-zone" id="rightStickZone" aria-label="Camera stick">
            <div class="stick-ring">
              <div class="stick-knob" id="rightStickKnob"></div>
            </div>
          </div>
          <div class="right-action-zone" aria-label="Action buttons">
            <button class="action-btn" id="phoneBtn" aria-label="Phone">☎</button>
            <button class="action-btn fire" id="fireBtn" aria-label="Fire weapon">✦</button>
            <button class="action-btn" id="jumpBtn" aria-label="Jump">△</button>
          </div>
        </div>
      </div>

      <div id="screenFade" aria-hidden="true"></div>
      <div class="message" id="messageBox">
        <div class="level-credits" id="levelCredits" hidden></div>
        <div class="panel">
          <div class="eyebrow"></div>
          <h1 id="messageTitle">PH Origins</h1>
          <p class="subtitle" id="messageText">Loading the office…</p>

          <div id="levelSelect" class="level-select hidden" aria-live="polite">
            <div class="level-select-header">
              <h2>Mission Select</h2>
              <button type="button" class="secondary" id="closeLevelSelect">Back</button>
            </div>
            <div id="levelList" class="level-list"></div>
          </div>

          <div class="button-row">
            <button class="primary" id="startBtn" disabled aria-busy="true">Loading…</button>
            <button class="secondary" id="newGameBtn" type="button" style="display:none">New Game</button>
            <button class="secondary" id="resetBtn">Reset</button>
            <button class="secondary" id="loadModelBtn" type="button">Load Level</button>
          </div>
          <input id="modelInput" type="file" accept=".glb,.gltf,.obj,.fbx" hidden />
        </div>
      </div>
    </div>
  </body>
</html>
