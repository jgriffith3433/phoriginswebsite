<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#08131d" />
    <meta name="description" content="PH Origins 3D game" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>PH Origins 3D</title>
    <style>
      :root {
        --bg: #07141e;
        --panel: rgba(10, 18, 28, 0.82);
        --panel-border: rgba(255,255,255,0.12);
        --text: #eefaff;
        --muted: #9bb0c1;
        --accent: #67d2ff;
        --good: #7af0c9;
        --warning: #ffd86a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-root {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(180deg, #091722 0%, #040b11 100%);
        --ui-scale: 1;
        --safe-top: 0px;
        --safe-bottom: 0px;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
      }

      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        transform: translate(-50%, -50%);
        z-index: 5;
        pointer-events: none;
      }

      #devToggle {
        position: absolute;
        top: calc(var(--safe-top) + 18px);
        right: 18px;
        z-index: 11;
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 999px;
        background: rgba(10, 20, 31, 0.72);
        color: var(--text);
        font-size: 10px;
        letter-spacing: 0.18rem;
        font-weight: 800;
        text-transform: uppercase;
        padding: 10px 14px;
        cursor: pointer;
        backdrop-filter: blur(8px);
      }

      #devPanel {
        position: absolute;
        top: calc(var(--safe-top) + 64px);
        right: 18px;
        z-index: 12;
        width: min(320px, calc(100vw - 36px));
        padding: 14px;
        border-radius: 18px;
        background: rgba(5, 10, 16, 0.88);
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text);
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        display: none;
      }

      #devPanel.visible {
        display: block;
      }

      .dev-title {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 0.2rem;
        text-transform: uppercase;
        color: var(--good);
      }

      .dev-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }

      .dev-stat {
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        padding: 8px 10px;
      }

      .dev-stat .label {
        display: block;
        font-size: 9px;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        color: var(--muted);
      }

      .dev-stat .value {
        display: block;
        margin-top: 4px;
        font-size: 18px;
        font-weight: 800;
      }

      .dev-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .dev-actions button,
      .dev-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 1 1 calc(50% - 8px);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.1rem;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--text);
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        cursor: pointer;
      }

      .dev-actions .primary {
        background: linear-gradient(135deg, var(--accent), var(--good));
        color: #07141e;
      }

      .dev-output {
        margin-top: 12px;
        width: 100%;
        min-height: 96px;
        padding: 8px 10px;
        border-radius: 10px;
        resize: vertical;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.02);
        color: var(--text);
      }

      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255,255,255,0.9);
        box-shadow: 0 0 12px rgba(103, 210, 255, 0.7);
      }

      #crosshair::before {
        left: 12px;
        top: 0;
        width: 2px;
        height: 26px;
      }

      #crosshair::after {
        left: 0;
        top: 12px;
        width: 26px;
        height: 2px;
      }

      .hud {
        position: absolute;
        top: calc(var(--safe-top) + 16px);
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        pointer-events: none;
        z-index: 2;
      }

      .brand {
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(10, 20, 31, 0.48);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(8px);
        letter-spacing: 0.28rem;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
      }

      .stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-right: 72px;
      }

      .stat {
        min-width: 110px;
        text-align: center;
        padding: 10px 12px;
        border-radius: 16px;
        background: rgba(10, 20, 31, 0.48);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(8px);
      }

      .health-stat {
        min-width: 168px;
        text-align: left;
      }

      .health-bar {
        width: 148px;
        height: 10px;
        margin-top: 6px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.38);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .health-fill {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: var(--good);
        transition: width 0.16s ease, background-color 0.16s ease;
      }

      .health-fill[data-band='mid'] {
        background: var(--warning);
      }

      .health-fill[data-band='low'] {
        background: #ff5d6c;
      }

      .label {
        display: block;
        font-size: 9px;
        letter-spacing: 0.18rem;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 2px;
      }

      .value {
        display: block;
        font-size: 22px;
        font-weight: 800;
      }

      body[data-device='desktop'] .controls {
        display: none;
      }

      .objective-hud {
        position: absolute;
        top: calc(var(--safe-top) + 76px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        pointer-events: none;
        display: none;
        min-width: 260px;
        max-width: min(420px, calc(100% - 32px));
        text-align: center;
        padding: 10px 16px;
        border-radius: 16px;
        background: rgba(10, 20, 31, 0.52);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(8px);
      }

      .objective-hud.visible {
        display: block;
      }

      .objective-kicker {
        display: block;
        font-size: 9px;
        letter-spacing: 0.22rem;
        text-transform: uppercase;
        color: var(--good);
        margin-bottom: 4px;
      }

      .objective-text {
        display: block;
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }

      .objective-dist {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }

      .alarm-flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 7;
        display: none;
        background: radial-gradient(ellipse at center, rgba(180, 16, 28, 0) 40%, rgba(150, 8, 18, 0.28) 100%);
        animation: alarmPulse 0.65s ease-in-out infinite;
      }

      .alarm-flash.visible {
        display: block;
      }

      @keyframes alarmPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }

      .inventory-hud {
        position: absolute;
        right: 18px;
        bottom: calc(var(--safe-bottom) + 118px);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        z-index: 8;
        pointer-events: none;
      }

      .inventory-hint,
      .inventory-close,
      .weapon-slot {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
        padding: 8px 12px;
        border-radius: 12px;
        background: rgba(10, 20, 31, 0.54);
        border: 1px solid var(--panel-border);
        color: var(--text);
        backdrop-filter: blur(8px);
        font-family: inherit;
        font-weight: 800;
        letter-spacing: 0.14rem;
        text-transform: uppercase;
        transform: none;
      }

      .inventory-hint {
        font-size: 10px;
        min-width: 108px;
        text-align: center;
        pointer-events: auto;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .inventory-hint kbd {
        display: inline-block;
        min-width: 1.4em;
        padding: 2px 5px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.08);
        font: inherit;
        font-size: 11px;
        letter-spacing: 0;
        line-height: 1.2;
      }

      .inventory-panel {
        display: none;
        width: min(260px, calc(100vw - 36px));
        padding: 10px;
        border-radius: 16px;
        background: rgba(10, 20, 31, 0.78);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(10px);
        pointer-events: auto;
        gap: 8px;
        flex-direction: column;
      }

      .inventory-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .inventory-panel-title {
        font-size: 10px;
        letter-spacing: 0.16rem;
        text-transform: uppercase;
        color: var(--muted);
      }

      .inventory-close {
        min-width: 36px;
        font-size: 16px;
        letter-spacing: 0;
        line-height: 1;
        cursor: pointer;
      }

      .weapon-slot {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        width: 100%;
        text-align: left;
        cursor: pointer;
        padding: 10px 12px;
      }

      .weapon-slot.drawn {
        border-color: rgba(122, 240, 201, 0.55);
        box-shadow: 0 0 0 1px rgba(122, 240, 201, 0.18);
      }

      .weapon-slot:disabled {
        cursor: default;
        opacity: 0.7;
      }

      .weapon-slot strong {
        font-size: 16px;
        letter-spacing: 0.08rem;
      }

      .weapon-state {
        font-size: 10px;
        letter-spacing: 0.12rem;
        color: var(--muted);
      }

      .weapon-slot.drawn .weapon-state {
        color: var(--good);
      }

      .inventory-items {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .inventory-hud.open .inventory-hint {
        display: none;
      }

      .inventory-hud.open .inventory-panel {
        display: flex;
      }

      .inventory-item {
        min-width: 0;
        padding: 7px 8px;
        border-radius: 12px;
        background: rgba(10, 20, 31, 0.54);
        border: 1px solid var(--panel-border);
        text-align: center;
        pointer-events: none;
      }

      .inventory-label {
        display: block;
        font-size: 9px;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        color: var(--muted);
      }

      .inventory-item strong {
        display: block;
        margin-top: 4px;
        font-size: 16px;
      }

      .controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(var(--safe-bottom) + 18px);
        display: flex;
        justify-content: space-between;
        align-items: end;
        padding: 0 14px;
        pointer-events: none;
        z-index: 2;
      }

      .left-stick-zone {
        position: relative;
        width: 150px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        touch-action: none;
      }

      .stick-ring {
        position: relative;
        width: 118px;
        height: 118px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(13, 20, 31, 0.42);
        box-shadow: inset 0 0 18px rgba(255,255,255,0.04);
      }

      .stick-ring::before {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: linear-gradient(135deg, rgba(103, 210, 255, 0.9), rgba(122, 240, 201, 0.8));
        border: 1px solid rgba(255,255,255,0.22);
        box-shadow: 0 0 20px rgba(103, 210, 255, 0.45);
      }

      .right-controls {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        pointer-events: auto;
      }

      .right-stick-zone {
        position: relative;
        width: 132px;
        height: 132px;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }

      .right-action-zone {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .touch-btn {
        width: 72px;
        height: 72px;
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 50%;
        background: rgba(13, 20, 31, 0.52);
        color: var(--text);
        font-size: 28px;
        font-weight: 700;
        touch-action: manipulation;
        user-select: none;
      }

      .touch-btn:active {
        transform: scale(0.97);
      }

      .action-btn {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.16);
        background: linear-gradient(135deg, var(--accent), var(--good));
        color: #07141e;
        font-weight: 900;
        font-size: 24px;
        pointer-events: auto;
      }

      .action-btn.fire {
        background: linear-gradient(135deg, #ffbf69, #ff7a59);
        color: #23120d;
      }

      .message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(3, 8, 14, 0.4);
        z-index: 3;
      }

      .message.hidden {
        display: none;
      }

      .panel {
        max-width: 440px;
        padding: 28px 24px;
        border-radius: 24px;
        border: 1px solid var(--panel-border);
        background: rgba(5, 10, 16, 0.8);
        text-align: center;
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.32rem;
        text-transform: uppercase;
        color: var(--good);
        margin-bottom: 10px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(36px, 5vw, 56px);
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .hidden {
        display: none !important;
      }

      .level-select {
        margin-top: 16px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 16px;
        background: rgba(17, 26, 36, 0.82);
        padding: 14px;
      }

      .level-select-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .level-select-header h2 {
        margin: 0;
        font-size: 18px;
      }

      .level-list {
        display: grid;
        gap: 10px;
      }

      .level-item {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }

      .level-item.locked,
      .level-item.coming-soon {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .level-item strong {
        display: block;
        font-size: 15px;
      }

      .level-item small {
        display: block;
        color: var(--muted);
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18rem;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), var(--good));
        color: #07141e;
      }

      .secondary {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text);
      }

      body[data-device='mobile'] .hud,
      body[data-device='tablet'] .hud {
        left: 10px;
        right: 10px;
        top: calc(var(--safe-top) + 10px);
      }

      body[data-device='mobile'] .stats,
      body[data-device='tablet'] .stats {
        gap: 6px;
      }

      body[data-device='mobile'] .stat,
      body[data-device='tablet'] .stat {
        min-width: 76px;
        padding: 8px 10px;
      }

      body[data-device='mobile'] .brand,
      body[data-device='tablet'] .brand {
        letter-spacing: 0.12rem;
        font-size: 9px;
        padding: 8px 12px;
      }

      body[data-device='mobile'] .controls,
      body[data-device='tablet'] .controls {
        padding: 0 12px;
      }

      body[data-device='mobile'] .touch-btn,
      body[data-device='tablet'] .touch-btn {
        width: 62px;
        height: 62px;
        font-size: 22px;
      }

      body[data-device='mobile'] .action-btn,
      body[data-device='tablet'] .action-btn {
        width: 80px;
        height: 80px;
        font-size: 22px;
      }

      @media (orientation: landscape) and (max-height: 520px) {
        .hud {
          top: calc(var(--safe-top) + 8px);
        }

        .stat {
          min-width: 70px;
          padding: 6px 8px;
        }

        .brand {
          letter-spacing: 0.18rem;
          font-size: 9px;
          padding: 7px 10px;
        }

        .controls {
          bottom: calc(var(--safe-bottom) + 10px);
        }

        .touch-btn {
          width: 54px;
          height: 54px;
          font-size: 18px;
        }

        .action-btn {
          width: 68px;
          height: 68px;
          font-size: 18px;
        }
      }

      @media (max-width: 600px) {
        .brand {
          letter-spacing: 0.18rem;
          font-size: 10px;
        }

        .stat {
          min-width: 92px;
        }

        .touch-btn {
          width: 62px;
          height: 62px;
          font-size: 22px;
        }

        .action-btn {
          width: 80px;
          height: 80px;
          font-size: 22px;
        }
      }
    </style>
    <script data-goatcounter="https://phorigins.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div id="game-root">
      <div class="hud">
        <div class="brand">PH ORIGINS</div>
        <div class="stats">
          <div class="stat health-stat">
            <span class="label">Health</span>
            <div class="health-bar" id="healthBar" role="progressbar" aria-label="Health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <span class="health-fill" id="healthFill" data-band="high"></span>
            </div>
          </div>
        </div>
      </div>

      <div id="crosshair" aria-hidden="true"></div>
      <div id="objectiveHud" class="objective-hud" aria-live="polite">
        <span class="objective-kicker">Objective</span>
        <span id="objectiveText" class="objective-text"></span>
        <span id="objectiveDist" class="objective-dist"></span>
      </div>
      <div id="alarmFlash" class="alarm-flash" aria-hidden="true"></div>
      <div id="inventoryHud" class="inventory-hud" aria-live="polite">
        <button type="button" id="inventoryHint" class="inventory-hint" aria-label="Open inventory"><kbd>I</kbd> Inventory</button>
        <div id="inventoryPanel" class="inventory-panel">
          <div class="inventory-panel-header">
            <span class="inventory-panel-title">Inventory</span>
            <button type="button" id="inventoryClose" class="inventory-close" aria-label="Close inventory">›</button>
          </div>
          <button type="button" id="weaponSlot" class="weapon-slot" aria-pressed="false">
            <span class="inventory-label">Weapon</span>
            <strong id="weaponSlotName">Pistol</strong>
            <span id="weaponSlotState" class="weapon-state">Holstered</span>
          </button>
          <div id="inventoryItems" class="inventory-items"></div>
        </div>
      </div>

      <button id="devToggle" type="button" aria-label="Toggle developer tools">DEV</button>
      <aside id="devPanel" aria-live="polite">
        <h2 class="dev-title">Dev Tools</h2>
        <div class="dev-grid">
          <div class="dev-stat">
            <span class="label">FPS</span>
            <span class="value" id="devFps">0</span>
          </div>
          <div class="dev-stat">
            <span class="label">Health</span>
            <span class="value" id="devHealth">100</span>
          </div>
          <div class="dev-stat">
            <span class="label">Level</span>
            <span class="value" id="devLevel">1</span>
          </div>
        </div>
        <div class="dev-actions">
          <button class="primary" type="button" data-dev-action="reset">Reset</button>
          <button type="button" data-dev-action="hp">HP 100</button>
          <button type="button" data-dev-action="level">+1 Level</button>
          <button type="button" data-dev-action="pause">Pause</button>
          <button type="button" data-dev-action="audio">Audio</button>
          <button type="button" data-dev-action="lighting">Lighting</button>
          <a href="/devtools.html" target="_blank" rel="noreferrer">Open Page</a>
        </div>
        <textarea id="devOutput" class="dev-output" readonly></textarea>
      </aside>

      <div class="controls">
        <div class="left-stick-zone" id="leftStickZone" aria-label="Movement stick">
          <div class="stick-ring">
            <div class="stick-knob" id="leftStickKnob"></div>
          </div>
        </div>

        <div class="right-controls">
          <div class="right-stick-zone" id="rightStickZone" aria-label="Camera stick">
            <div class="stick-ring">
              <div class="stick-knob" id="rightStickKnob"></div>
            </div>
          </div>
          <div class="right-action-zone" aria-label="Action buttons">
            <button class="action-btn fire" id="fireBtn" aria-label="Fire weapon">✦</button>
            <button class="action-btn" id="jumpBtn" aria-label="Jump">△</button>
          </div>
        </div>
      </div>

      <div class="message" id="messageBox">
        <div class="panel">
          <div class="eyebrow"></div>
          <h1 id="messageTitle">PH Origins</h1>
          <p class="subtitle" id="messageText">Get ready to embark on an exciting journey!</p>

          <div id="levelSelect" class="level-select hidden" aria-live="polite">
            <div class="level-select-header">
              <h2>Mission Select</h2>
              <button type="button" class="secondary" id="closeLevelSelect">Back</button>
            </div>
            <div id="levelList" class="level-list"></div>
          </div>

          <div class="button-row">
            <button class="primary" id="startBtn">Start</button>
            <button class="secondary" id="resetBtn">Reset</button>
            <button class="secondary" id="loadModelBtn" type="button">Load Level</button>
          </div>
          <input id="modelInput" type="file" accept=".glb,.gltf,.obj,.fbx" hidden />
        </div>
      </div>
    </div>
  </body>
</html>
