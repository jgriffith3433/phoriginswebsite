<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PH Origins Level Editor</title>
    <style>
      :root {
        --bg: #0c1117;
        --bg-alt: #121a22;
        --panel: #151e28;
        --panel-2: #1a2630;
        --panel-3: #212f3a;
        --border: rgba(255,255,255,0.08);
        --border-strong: rgba(103,210,255,0.42);
        --text: #edf7ff;
        --muted: #a7bac8;
        --accent: #67d2ff;
        --accent-2: #8ce2ff;
        --primary: #4bb3ff;
        --success: #8ef0c4;
        --warning: #ffca7a;
        --danger: #ff7d7d;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #0b1016 0%, #0f1720 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body { padding: 0; }

      .editor-shell {
        display: grid;
        grid-template-rows: 60px minmax(0, 1fr);
        height: 100vh;
        background: linear-gradient(180deg, rgba(15,23,32,0.98), rgba(12,17,23,0.98));
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        border-bottom: 1px solid var(--border);
        background: rgba(10,15,20,0.9);
        backdrop-filter: blur(8px);
      }

      .topbar-title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.08rem;
        text-transform: uppercase;
        font-size: 12px;
      }

      .logo {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: linear-gradient(135deg, var(--accent), var(--success));
        box-shadow: 0 0 18px rgba(103,210,255,0.65);
      }

      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #saveStatus {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.06rem;
        text-transform: uppercase;
        margin-right: 4px;
      }

      button, .button-link {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 11px;
        letter-spacing: 0.09rem;
        text-transform: uppercase;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }

      button.primary, .button-link.primary {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: #061118;
        border-color: transparent;
      }

      button.danger {
        border-color: rgba(255,125,125,0.4);
        color: var(--danger);
        background: rgba(255,125,125,0.06);
        margin-top: 4px;
      }

      button.active {
        border-color: var(--border-strong);
        background: rgba(103,210,255,0.12);
        color: var(--accent-2);
      }

      select {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 11px;
        text-transform: none;
      }

      .layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr) 330px;
        min-height: 0;
      }

      .panel {
        border-right: 1px solid var(--border);
        background: rgba(12,18,24,0.9);
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
      }

      .panel:last-child {
        border-right: none;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12rem;
        color: var(--muted);
        font-weight: 700;
        position: sticky;
        top: 0;
        background: rgba(12,18,24,0.95);
        z-index: 1;
      }

      .panel-body {
        padding: 10px 10px 18px;
      }

      .panel-split {
        display: flex;
        flex-direction: column;
        min-height: 0;
        flex: 1;
      }

      .panel-split .panel-section {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-bottom: 1px solid var(--border);
      }

      .panel-split .panel-section:last-child {
        flex: 1;
        border-bottom: none;
      }

      .panel-split .panel-section .panel-body {
        overflow: auto;
      }

      .hierarchy-list,
      .inspector-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .hierarchy-item,
      .inspector-row {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255,255,255,0.015);
        padding: 10px 12px;
      }

      .hierarchy-item {
        cursor: pointer;
      }

      .hierarchy-item.drop-target {
        outline: 1px dashed #67d2ff;
        background: rgba(103, 210, 255, 0.16);
      }

      .hierarchy-item.active {
        border-color: var(--border-strong);
        background: rgba(103,210,255,0.08);
      }

      .hierarchy-item .name,
      .inspector-row .label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
      }

      .inspector-row input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 8px 9px;
        font-size: 12px;
      }

      .type-tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 3px 7px;
        border-radius: 999px;
        background: rgba(103,210,255,0.08);
        border: 1px solid rgba(103,210,255,0.35);
        color: var(--accent-2);
        font-size: 9px;
        letter-spacing: 0.06rem;
        text-transform: uppercase;
      }

      .component-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .component-empty {
        color: var(--muted);
        font-size: 11px;
      }
      .component-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px 4px 10px;
        border-radius: 999px;
        background: rgba(103,210,255,0.08);
        border: 1px solid rgba(103,210,255,0.35);
        color: var(--accent-2);
        font-size: 11px;
      }
      .component-chip-remove {
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        padding: 0 2px;
        border-radius: 999px;
      }
      .component-chip-remove:hover {
        background: rgba(255,255,255,0.12);
      }
      .component-add {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .component-add select {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 6px 8px;
        font-size: 12px;
      }
      .component-add button {
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: rgba(103,210,255,0.1);
        color: var(--accent-2);
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .component-add button:disabled,
      .component-add select:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* Project file tree */
      .fs-section { margin-bottom: 10px; }
      .fs-section-label {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.1rem;
        text-transform: uppercase;
        padding: 6px 10px;
        font-weight: 700;
      }
      .fs-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 12px;
        cursor: default;
        user-select: none;
      }
      .fs-row:hover { background: rgba(255,255,255,0.04); }
      .fs-dir { cursor: pointer; font-weight: 600; }
      .fs-file.fs-draggable { cursor: grab; }
      .fs-file.fs-draggable:hover { background: rgba(103,210,255,0.08); }
      .fs-dragging { opacity: 0.4; }
      .fs-caret { width: 10px; color: var(--muted); font-size: 10px; }
      .fs-icon { width: 16px; text-align: center; }
      .fs-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .workspace {
        display: grid;
        grid-template-rows: minmax(56px, auto) minmax(0, 1fr) 160px;
        min-height: 0;
      }

      .workspace-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        background: rgba(16,23,28,0.9);
        flex-wrap: wrap;
        gap: 8px;
      }

      .workspace-tabs {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tab {
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 11px;
        letter-spacing: 0.08rem;
        text-transform: uppercase;
        font-weight: 700;
      }

      .tab.active {
        color: var(--text);
        border-color: var(--border-strong);
        background: rgba(103,210,255,0.08);
      }

      .scene-view {
        position: relative;
        overflow: hidden;
        background: #0c141a;
      }

      .scene-dropzone {
        position: absolute;
        inset: 12px;
        border: 1px dashed transparent;
        border-radius: 16px;
      }

      .scene-dropzone.dragover {
        border-color: var(--success);
        background: rgba(142,240,196,0.06);
      }

      .viewport-shell {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 12px;
        overflow: hidden;
        background: #060a0e;
      }

      #viewportCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }

      .viewport-hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 14px;
      }

      .viewport-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .viewport-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 999px;
        background: rgba(9,15,20,0.62);
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.09rem;
        text-transform: uppercase;
      }

      .viewport-hint {
        pointer-events: none;
        background: rgba(9,15,20,0.62);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        padding: 8px 10px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.03rem;
        max-width: 220px;
        text-align: right;
      }

      .bottom-console {
        border-top: 1px solid var(--border);
        background: rgba(12,17,24,0.9);
        padding: 12px 14px 10px;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .console-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      textarea {
        width: 100%;
        min-height: 90px;
        resize: vertical;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 12px;
        font-family: Consolas, 'Courier New', monospace;
        font-size: 11px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.08rem;
        text-transform: uppercase;
        font-weight: 700;
      }

      .field input, .field select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 9px 10px;
        font-size: 13px;
      }

      .inspector-row .value {
        color: var(--muted);
        font-size: 12px;
        word-break: break-word;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .panel {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(5,8,11,0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }

      .modal-overlay[hidden] { display: none; }

      .modal {
        width: 480px;
        max-width: calc(100vw - 40px);
        max-height: calc(100vh - 60px);
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
        letter-spacing: 0.04rem;
      }

      .modal-body {
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .modal-footer {
        padding: 14px 18px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid var(--border);
      }

      .icon-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 18px;
        cursor: pointer;
        line-height: 1;
      }

      .import-anim-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .import-anim-row {
        display: flex;
        gap: 8px;
      }

      .import-anim-row input {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 8px 9px;
        font-size: 13px;
      }

      .import-anim-row input.anim-name { flex: 0 0 110px; }
      .import-anim-row input.anim-path { flex: 1; }

      .import-anim-row button {
        flex: 0 0 auto;
      }

      .import-model-status {
        font-size: 12px;
        color: var(--muted);
        white-space: pre-wrap;
        max-height: 120px;
        overflow-y: auto;
      }

      .import-model-status.error { color: var(--danger); }
      .import-model-status.success { color: var(--success); }

      .import-choice {
        display: flex;
        gap: 16px;
        margin: 8px 0 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .project-drop-hint {
        padding: 8px 10px 12px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }

      #projectTree.dragover {
        outline: 1px dashed var(--success);
        background: rgba(142,240,196,0.06);
      }
    </style>
  </head>
  <body>
    <div class="editor-shell">
      <header class="topbar">
        <div class="topbar-title">
          <span class="logo"></span>
          <span>PH Origins / Dev Tools</span>
        </div>
        <div class="toolbar-actions">
          <select id="levelSelect" title="Active level"></select>
          <span id="saveStatus">Ready</span>
          <button class="primary" id="saveJsonBtn">Save Scene</button>
          <button id="playSceneBtn">Play</button>
          <button id="exportSceneBtn">Export</button>
          <button id="importSceneBtn">Import</button>
          <input id="sceneImportInput" type="file" accept=".json" hidden />
        </div>
      </header>

      <div class="layout">
        <aside class="panel panel-split">
          <div class="panel-section" style="flex: 1.3;">
            <div class="panel-header">
              <span>Project</span>
              <button id="refreshAssetsBtn">Refresh</button>
            </div>
            <div class="panel-body">
              <div class="project-drop-hint">Drop Mixamo FBX files here. Use Animation only for no-skin clips (Idle / Walk / Jump).</div>
              <div id="projectTree"></div>
            </div>
          </div>
          <div class="panel-section" style="flex: 1;">
            <div class="panel-header">
              <span>Hierarchy</span>
            </div>
            <div class="panel-body">
              <div class="hierarchy-list" id="hierarchyTree"></div>
            </div>
          </div>
        </aside>

        <main class="workspace">
          <div class="workspace-bar">
            <div class="workspace-tabs">
              <span class="tab active">Scene</span>
              <button data-gizmo-mode="position" class="active">Move</button>
              <button data-gizmo-mode="rotation">Rotate</button>
              <button data-gizmo-mode="scale">Scale</button>
            </div>
            <div class="toolbar-actions">
              <button id="addObjectBtn">Duplicate</button>
              <select id="addStructureKind" title="Structure type to add">
                <option value="wall">Wall</option>
                <option value="pillar">Pillar</option>
                <option value="ground">Ground</option>
              </select>
              <button id="addStructureBtn">Add Structure</button>
              <button id="addTriggerBtn" class="primary">Add Trigger</button>
              <button id="importModelBtn">Import Model</button>
            </div>
          </div>

          <div class="scene-view">
            <div class="scene-dropzone" id="sceneDropZone">
              <div class="viewport-shell" aria-label="3D scene viewport">
                <canvas id="viewportCanvas"></canvas>
                <div class="viewport-hud">
                  <div class="viewport-badges">
                    <span class="viewport-badge">Scene</span>
                    <span class="viewport-badge">Live</span>
                  </div>
                  <div class="viewport-hint">Right-click + WASD to fly &middot; Left-click to select &middot; Drag assets from Project to place</div>
                </div>
              </div>
            </div>
          </div>

          <div class="bottom-console">
            <div class="console-tabs">
              <span class="tab active">Console</span>
            </div>
            <textarea id="consoleOutput" spellcheck="false" readonly>Ready.</textarea>
          </div>
        </main>

        <aside class="panel">
          <div class="panel-header">
            <span>Inspector</span>
          </div>
          <div class="panel-body">
            <div id="inspectorContent" class="inspector-list"></div>
          </div>
        </aside>
      </div>
    </div>

    <div class="modal-overlay" id="importModelOverlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <span>Import Model</span>
          <button id="importModelCloseBtn" class="icon-btn" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="importModelName">Asset Name</label>
            <input id="importModelName" type="text" placeholder="e.g. ch44-hero" />
          </div>
          <div class="field">
            <label for="importModelBasePath">Base FBX Path</label>
            <input id="importModelBasePath" type="text" placeholder="C:\path\to\model.fbx" />
          </div>
          <div class="field">
            <label>Mixamo Animation FBX Files (optional)</label>
            <div id="importModelAnimList" class="import-anim-list"></div>
            <button id="importModelAddAnimBtn" type="button">+ Add Animation</button>
          </div>
          <div id="importModelStatus" class="import-model-status"></div>
        </div>
        <div class="modal-footer">
          <button id="importModelCancelBtn">Cancel</button>
          <button id="importModelSubmitBtn" class="primary">Convert &amp; Import</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="fbxImportOverlay" hidden>
      <div class="modal">
        <div class="modal-header">
          <span>Import FBX</span>
          <button id="fbxImportCloseBtn" class="icon-btn" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <p id="fbxImportFileName" class="project-drop-hint"></p>
          <div class="import-choice">
            <label><input type="radio" name="fbxImportMode" value="animation" checked /> Animation only</label>
            <label><input type="radio" name="fbxImportMode" value="character" /> Character model</label>
          </div>
          <div class="field" id="fbxClipField">
            <label for="fbxClipName">Clip name</label>
            <input id="fbxClipName" type="text" placeholder="Idle, Walk, Jump..." />
          </div>
          <div class="field" id="fbxTargetField">
            <label for="fbxTargetName">Apply to character</label>
            <input id="fbxTargetName" type="text" value="ch44-hero" />
          </div>
          <div class="field" id="fbxCharacterField" hidden>
            <label for="fbxCharacterName">Asset name</label>
            <input id="fbxCharacterName" type="text" placeholder="e.g. ch44-hero" />
          </div>
          <div id="fbxImportStatus" class="import-model-status"></div>
        </div>
        <div class="modal-footer">
          <button id="fbxImportCancelBtn">Cancel</button>
          <button id="fbxImportSubmitBtn" class="primary">Convert &amp; Import</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
